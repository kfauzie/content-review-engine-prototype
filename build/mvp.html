<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content review AI: performance benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e9edf2;
--red:#d1342f;--red-wash:#fdeeed;--hi:#b42318;--hi-wash:#fef3f2;--lo:#475569;
--amber:#b7791f;--amber-bar:#c08a2e;--amber-wash:#fdf6e7;--grey-bar:#cbd5e1;
--green:#15803d;--green-bar:#4ead78;--green-wash:#eaf7ef;--blue:#2f62c9;--blue-wash:#eef4ff;--violet:#6d4bd1;--violet-wash:#f4f0ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 32px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.crumb{font-weight:500;color:var(--muted);margin-left:2px}
.badge{font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 10px}
main{max-width:1120px;margin:0 auto;padding:36px 32px 64px}
.view{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:36px;letter-spacing:-.9px;margin:0 0 6px;font-weight:700;line-height:1.15}
.sub1{color:var(--muted);font-size:15px;margin:0 0 22px}
h2{font-size:18px;margin:0 0 6px;font-weight:650}
/* top cards */
.kpis{display:grid;grid-template-columns:7fr 3fr;margin-bottom:40px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line)}
.kpis .kpi{box-shadow:none;border-radius:0}
.kpi{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line)}
.kh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.3px;flex-wrap:wrap}
.risk{padding:26px 28px;background:linear-gradient(180deg,#fff 0%,#fff7f6 100%)}
.cap{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;color:var(--muted)}
.cap i{width:9px;height:9px;border-radius:2px;background:var(--green-bar);display:inline-block}
.cap b{color:var(--ink2);font-weight:600}
.fa{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:22px 24px;background:#fffbf3;border-left:1px solid var(--line)}

.fa .bigrow .big{font-size:34px!important;letter-spacing:-1px}
.fa .fal{font-size:15px}
.fa .lab{margin-top:0;font-size:12px}
.fa .tag{align-self:flex-start}
.fal{font-size:18px;font-weight:650;color:var(--ink2)}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.risk .tag{color:var(--red);background:var(--red-wash)} .fa .tag{color:var(--amber);background:var(--amber-wash)}
.nums{display:flex;align-items:flex-end;gap:28px;margin:16px 0 14px;flex-wrap:wrap}
.big{font-weight:750;letter-spacing:-2px;line-height:.95;font-variant-numeric:tabular-nums}
.big.base{font-size:34px;color:var(--ink2);letter-spacing:-1px}
.big.miss{font-size:72px;color:var(--red)} .fa .bigrow .big{font-size:48px;color:var(--amber)}
.lab{color:var(--muted);font-size:13px;margin-top:6px}
.sbar{display:flex;gap:2px;height:14px}
.sbar i,.mini i{display:block;height:100%}
.sbar i:first-child,.mini i:first-child{border-radius:4px 0 0 4px} .sbar i:last-child,.mini i:last-child{border-radius:0 4px 4px 0}
.sbar i:only-child,.mini i:only-child{border-radius:4px}
.bigrow{display:flex;align-items:center;gap:10px}
.jump{position:relative;cursor:pointer;transition:background-color .15s}
.jump:after{content:"";position:absolute;top:26px;right:24px;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.jump:hover:after{transform:translateY(3px) rotate(45deg)}
.risk.jump:hover{background:#fffaf9!important} .fa.jump:hover{background:#f8efdc!important}
h2[id]{scroll-margin-top:16px}
.secsub{color:var(--muted);font-size:14px;margin:-4px 0 14px}
.fixes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:8px 0 40px}
.fix{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.fix .no{width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.fx{display:grid;gap:8px}
.fq{position:relative;display:block;background:var(--violet-wash);border-radius:10px;padding:9px 26px 9px 11px;font-size:13px;color:var(--ink2);transition:transform .15s,box-shadow .15s}
.fq:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,23,42,.08)}
.fq.nolink{padding-right:11px}
.fq.nolink:after{display:none}
.fq:after{content:"";position:absolute;right:11px;bottom:14px;width:6px;height:6px;border-right:1.5px solid var(--violet);border-bottom:1.5px solid var(--violet);transform:rotate(-45deg)}
.fl{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:-4px}
.fix .rc{margin:0;font-size:13px;color:var(--ink2)}
.fq mark{background:#e3d9ff;color:var(--ink);border-radius:3px;padding:0 2px}
.fq .by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.fq .av{width:22px;height:22px;font-size:10px;background:var(--violet)}
.impact{margin-top:auto;border-radius:10px;background:var(--bg);padding:8px;display:grid;gap:6px}
.impact .ih{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.impact .ib{border-radius:7px;padding:6px 9px;font-size:12px;font-weight:600;background:#fff}
.impact .ib b{font-size:13.5px;font-variant-numeric:tabular-nums}
.impact .ib .hp{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:0}
.impact .ib.m{color:var(--red);box-shadow:inset 3px 0 0 var(--red)} .impact .ib.f{color:var(--amber);box-shadow:inset 3px 0 0 var(--amber-bar)}
.fix h3{font-size:15px;line-height:1.35;margin:0;font-weight:650}
.fix .why{color:var(--muted);font-size:13px;margin:0}
.fix ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13px} .fix li{margin:2px 0}
.imp{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.imp span{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.imp .m{color:var(--red);background:var(--red-wash)} .imp .f{color:var(--amber);background:var(--amber-wash)} .imp .z{color:var(--muted);background:var(--bg);font-weight:500}
.est{font-size:12px;color:var(--faint);font-weight:500;margin-left:6px}
.sleg{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sleg span{display:inline-flex;align-items:center;gap:6px} .sleg b{color:var(--ink);font-weight:600}
.sleg i{width:9px;height:9px;border-radius:2px;display:inline-block}
/* categories */
.grp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grp i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line);margin-bottom:12px;overflow:hidden}
.cat.hi{box-shadow:inset 4px 0 0 var(--hi),0 0 0 1px var(--line)} .cat.am{box-shadow:inset 4px 0 0 #d9b979,0 0 0 1px var(--line)}
.top{display:grid;grid-template-columns:1fr auto 18px;gap:16px;align-items:center;padding:18px 22px;width:100%;text-align:left}
.top[role=button]{cursor:pointer} .top[role=button]:hover{background:#fbfbfc}
.n{font-size:18px;font-weight:650;letter-spacing:-.2px} .d{color:var(--muted);font-size:13px}
.cnum{text-align:right}
.c{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;font-size:32px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1}
.c small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;white-space:nowrap}
.cin{font-size:11.5px;color:var(--faint);margin-top:3px;white-space:nowrap}
.hi .c{color:var(--hi)} .lo .c{color:var(--lo)} .am .c{color:var(--amber)} .c.zero{color:var(--faint)!important}
.mini{display:flex;gap:2px;height:8px}
.tog{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-135deg);margin-top:4px;justify-self:end;transition:transform .2s}
.shut .tog{transform:rotate(45deg);margin-top:-4px} .tog.none{visibility:hidden}
.fasec{margin-top:40px}
.fasec .top{padding:14px 22px} .fasec .n{font-size:15px} .fasec .c{font-size:22px}
/* carousel */
.car{padding:0 22px 18px}
.carhead{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-6px 0 10px;color:var(--faint);font-size:12px}
.arr{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;background:#fff}
.arr:before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2)}
.arr.l:before{transform:rotate(135deg);margin-left:3px} .arr.r:before{transform:rotate(-45deg);margin-right:3px}
.arr:disabled{opacity:.35;cursor:default}
.cards{display:grid;gap:12px}
.cards.moved .ex{animation:in .25s ease-out}
.fq .cl{display:block;margin-top:6px;font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:var(--amber);font-weight:500}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--lo)}
/* transcript */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:18px}
.back:before{content:"";width:7px;height:7px;border-left:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.ctx{display:grid;grid-template-columns:1fr 1fr 2fr;background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);margin:14px 0 16px}
.ctx > div{padding:16px 20px;border-left:1px solid var(--line)} .ctx > div:first-child{border-left:0}
.ctx .wide{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
.k{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.v{color:var(--ink2)} .v b{color:var(--ink)}
.tr{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:12px 24px 18px}
.turn{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:9px 0}
.turn .t{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.turn .s{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:1px}
.turn.q .x{color:var(--muted)}
.hit{border-radius:12px;padding:12px 14px}
.hit.missed{background:var(--red-wash);box-shadow:inset 3px 0 0 var(--red)} .hit.false_alarm{background:var(--amber-wash);box-shadow:inset 3px 0 0 var(--amber-bar)}
.hit .htag{display:inline-block;font-size:12px;font-weight:600;background:#fff;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.hit.missed .htag{color:var(--red)} .hit.false_alarm .htag{color:var(--amber)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.note{border-radius:10px;padding:11px 13px}
.note.rev{background:var(--blue-wash);box-shadow:inset 3px 0 0 var(--blue)} .note.rev .nt{color:var(--blue)}
.note.agent{background:var(--violet-wash);box-shadow:inset 3px 0 0 var(--violet)} .note.agent .nt{color:var(--violet)}
.nt{font-size:13px;font-weight:650} .ns{font-size:12px;color:var(--muted);margin:0 0 6px}
.notfound{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.view,.cards.moved .ex{animation:none} a.ex,.tog{transition:none}}
/* tablet and phone */
@media (max-width:900px){
  .kpis{grid-template-columns:1fr} .fa{border-left:0;border-top:1px solid var(--line)} .fixes{grid-template-columns:1fr}
  .ctx{grid-template-columns:1fr 1fr} .ctx > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  nav{padding:10px 16px;height:auto;min-height:56px;flex-wrap:wrap;gap:6px 12px} .brand,.badge{white-space:nowrap} main{padding:24px 16px 48px}
  h1{font-size:28px} .big.miss{font-size:56px} .fa .bigrow .big{font-size:40px}
  .top{padding:14px 16px} .car{padding:0 16px 14px} .tr{padding:8px 16px 14px}
  .notes{grid-template-columns:1fr} .turn{grid-template-columns:40px 1fr;gap:10px}
  .est{display:block;margin:4px 0 0}
  .ctx{grid-template-columns:1fr} .ctx > div{border-left:0!important;border-top:1px solid var(--line)} .ctx > div:first-child{border-top:0}
}

/* ---- legal theme: presentation only (one font, warm paper neutrals, hairline surfaces, document-style transcript) ---- */
:root{--bg:#f6f4ef;--card:#fffefb;--ink:#14213d;--ink2:#2f3b52;--muted:#6b7280;--faint:#9ca3af;--line:#e7e2d8;
--red:#b3261e;--red-wash:#fbefec;--hi:#9b1c1c;--hi-wash:#fbf1ee;--lo:#3f4b5e;
--amber:#9a6412;--amber-bar:#b8862f;--amber-wash:#fbf5e8;--grey-bar:#d9d4c9;
--green:#256a46;--green-bar:#5e9c78;--violet:#4c3a8f;--violet-wash:#f3f0fa;--blue:#2c5282;--blue-wash:#eef3fa;
--serif:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg)}
nav{background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:15px;font-weight:650;letter-spacing:-.1px}
.brand svg rect{fill:var(--ink)}
h1{font-family:var(--serif);font-weight:700;letter-spacing:-.9px;font-size:38px}
h2{font-family:var(--serif);font-weight:650;font-size:20px;letter-spacing:-.3px;margin-bottom:10px}
.sub1{font-size:15.5px;max-width:760px}
.kpis,.cat,.fix,.ctx,.tr{box-shadow:0 0 0 1px var(--line)!important;border-radius:14px}
.kpis{box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(20,33,61,.04)!important}
.risk{background:var(--card)!important;border-top:3px solid var(--red)}
.fa{background:var(--amber-wash)!important;border-top:3px solid var(--amber-bar)}
.kh{font-family:var(--serif);font-weight:650;font-size:20px;letter-spacing:-.3px}
.kh b{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:750}
.big{letter-spacing:-2.5px}
.tag{border-radius:6px;letter-spacing:.01em}
.risk .tag{background:var(--red);color:#fff} .fa .tag{background:transparent;border:1px solid var(--amber-bar);color:var(--amber)}
.sbar{height:10px} .sbar i:first-child{border-radius:5px 0 0 5px} .sbar i:last-child{border-radius:0 5px 5px 0}
.grp{letter-spacing:.08em;font-size:11.5px}
.cat.hi{box-shadow:inset 3px 0 0 var(--hi),0 0 0 1px var(--line)!important} .cat.am{box-shadow:inset 3px 0 0 var(--amber-bar),0 0 0 1px var(--line)!important}
.n{font-family:var(--serif);font-weight:650;font-size:18px;letter-spacing:-.2px}
.fasec .n{font-size:17px}
.fix{gap:12px}
.fix .no{background:var(--ink)}
.fix h3{font-family:var(--serif);font-weight:650;font-size:16px;letter-spacing:-.2px}
.fl{letter-spacing:.08em;color:var(--muted)}
.fq{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--violet);font-family:var(--serif);font-size:13.5px;line-height:1.55}
.fq .by{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.fq mark{background:linear-gradient(transparent 55%,#e2dbf6 55%);padding:0 1px;border-radius:0}
.impact{background:transparent;border-top:1px solid var(--line);border-radius:0;padding:10px 0 0}
.impact .ib{background:var(--card);border:1px solid var(--line)}
.eyebrow{letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.ctx .k{letter-spacing:.08em}
.tr{padding:20px 40px 28px}
.turn .x,.hit > div:not(.notes){font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--ink)}
.turn.q .x{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:var(--muted)}
.hit.missed{background:var(--red-wash);box-shadow:inset 3px 0 0 var(--red)} .hit.false_alarm{background:var(--amber-wash);box-shadow:inset 3px 0 0 var(--amber-bar)}
.hit .htag{border:1px solid currentColor;background:transparent;border-radius:6px}
.note{background:var(--card)!important;border:1px solid var(--line)}
.note.rev{box-shadow:inset 3px 0 0 var(--blue)!important} .note.agent{box-shadow:inset 3px 0 0 var(--violet)!important}
.notes .note{font-size:13.5px;line-height:1.55}
@media (max-width:640px){h1{font-size:30px} .tr{padding:10px 16px 16px} .turn .x,.hit > div:not(.notes){font-size:15px}}

/* ---- example cards, toned down (review-tool convention: neutral items, one highlight colour on the trigger words) ---- */
.fq{background:var(--card)!important;border:1px solid var(--line)!important;border-left:1px solid var(--line)!important;box-shadow:none}
.fq:hover{border-color:#d6d0c4!important;box-shadow:0 2px 8px rgba(20,33,61,.06);transform:none}
.fq mark{background:linear-gradient(transparent 50%,#fbeaa6 50%)!important;color:var(--ink)}
.fq .av{background:#e9e5dc!important;color:var(--ink2)!important;font-weight:650}
.fq .by{color:var(--faint)}
.fq:after{border-color:var(--faint)!important}
.fq .cl{color:var(--muted)!important;font-weight:500}

/* ---- category examples as rows (list convention: neutral rows, one highlight, muted time on the right) ---- */
.exrows{margin:0 22px 14px;border-top:1px solid var(--line)}
.rx{display:grid;grid-template-columns:1fr auto 12px;gap:14px;align-items:start;padding:12px 6px;border-bottom:1px solid var(--line)}
.rx:last-child{border-bottom:0}
a.rx{transition:background-color .15s} a.rx:hover{background:#faf8f2}
.rx .av{width:26px;height:26px;font-size:10px;background:#e9e5dc;color:var(--ink2);font-weight:650;margin-top:1px}
.rx .rq{font-size:14px;line-height:1.5;color:var(--ink)}
.rx .rq mark{background:linear-gradient(transparent 50%,#fbeaa6 50%);color:var(--ink);padding:0 1px}
.rx .cl{display:block;margin-top:3px;font-size:12px;color:var(--muted);font-weight:500}
.rx .when{font-size:12px;color:var(--faint);white-space:nowrap;padding-top:3px;font-variant-numeric:tabular-nums}
.rx .go{width:7px;height:7px;margin-top:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg)}
div.rx .go{visibility:hidden}
@media (max-width:640px){.exrows{margin:0 16px 12px} .rx{grid-template-columns:1fr 12px;gap:10px} .rx .when{grid-column:1;grid-row:2;padding-top:0;white-space:normal} .rx .go{grid-column:2;grid-row:1}}

/* release gate, masked IDs */
.tabs{display:flex;gap:4px;margin-left:18px;margin-right:auto}
.tabs a{font-size:14px;font-weight:550;color:var(--muted);padding:6px 10px;border-radius:8px}
.tabs a:hover{background:var(--bg);color:var(--ink)} .tabs a[aria-current]{color:var(--ink);background:var(--bg)}
.pid{font-weight:600;color:var(--ink2)}
.ent{display:inline-block;font-size:.92em;font-weight:600;color:#3a3f6b;background:#ecebf6;border-radius:5px;padding:0 5px;line-height:1.45;cursor:help;white-space:nowrap}
.legend{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:14px 20px;margin:0 0 16px}

hat name private individuals, and answers in which the expert names an insider as the source.", "examples": [{"name": "Expert 6378", "highlight": "My contact Person 2315, who runs procurement there now, told me", "quote": "My contact Person 2315, who runs procurement there now, told me last week they're ending contracts with two of those tools in Q1.", "date": "2026-11-09", "ts": "01:34", "kind": "missed", "category": "Source disclosure", "transcript": "missed-expert-6378", "tid": "0837"}, {"name": "Expert 3658", "highlight": "Person 8435", "quote": "I remember Person 8435, who led their financial crime team at the time, was on sick leave for months after a mental breakdown.", "date": "2026-11-13", "ts": "01:24", "kind": "missed", "category": "Personal data", "transcript": "missed-expert-3658", "tid": "0629"}], "how": ["Flag any named private individual mentioned with health, family or legal details.", "Flag phrases that point to an inside source, such as “my contact”, “told me” and “I still speak to”.", "Send both to a reviewer, with the name highlighted."]}, {"id": "sources", "title": "Check if the cited source is already public", "cause_label": "Why the AI raised a false alarm", "root_cause": "Most false alarms were statements the expert attributed to a public source, such as an earnings call, a press release or an annual report. The AI flagged them without checking whether the information was in fact public.", "examples": [{"name": "Expert 1578", "highlight": "Our prices are on the website", "quote": "Our prices are on the website. The standard tier is £40 per user, and that hasn't changed this year.", "date": "2026-11-04", "ts": "01:56", "kind": "false_alarm", "category": "Current-employer confidential", "transcript": "false-alarm-expert-1578", "tid": "0525"}, {"name": "Expert 3985", "highlight": "As their annual report says", "quote": "As their annual report says, they've been closing stores in the north for two years, so the shift to online isn't new.", "date": "2026-11-14", "ts": "00:51", "kind": "false_alarm", "category": "Material non-public information", "transcript": "false-alarm-expert-3985", "tid": "0106"}, {"name": "Expert 8996", "highlight": "On their Q2 earnings call in August", "quote": "Company 9910 is a good one because they're transparent. On their Q2 earnings call in August, they reported gross margin of 31.4%, up from 28.9% a year earlier, and forecast 32% to 33% for the full year.", "date": "2026-11-12", "ts": "00:36", "kind": "false_alarm", "category": "Material non-public information", "transcript": "false-alarm-expert-8996", "tid": "0803"}, {"name": "Expert 8418", "highlight": "We announced the Leeds office in a press release", "quote": "We announced the Leeds office in a press release last month, so it's no secret we're expanding in the north.", "date": "2026-10-28", "ts": "01:20", "kind": "false_alarm", "category": "Current-employer confidential", "transcript": "false-alarm-expert-8418", "tid": "0570"}], "how": ["Detect when an expert cites a source.", "Check that source: filings, press releases or the company's website.", "Clear the statement if the information is there; keep it flagged if it is not."]}], "cards": [{"id": "missed-expert-9928", "kind": "missed", "category": "Material non-public information", "name": "Expert 9928", "date": "2026-11-12", "ts": "01:24", "quote": "Look, I'm not saying anything specific, but if I were you I'd watch their Q3 numbers closely. Let's just say there's been some noise around one of their knee replacement devices, and I still talk to people there.", "source": "test set T5-01:24", "cleared": null, "transcript": "missed-expert-9928", "fix": "declaration", "highlight": "watch their Q3 numbers closely", "fa_type": null, "tid": "0702"}, {"id": "missed-expert-6456", "kind": "missed", "category": "Material non-public information", "name": "Expert 6456", "date": "2026-10-29", "ts": "02:17", "quote": "Between us, the regulator's decision on their diabetes drug came bac et tier from January. It's been approved, and sales got the presentation last week, but customers haven't been told yet.", "source": "test set T3-01:34", "cleared": null, "transcript": "missed-expert-1342", "fix": "declaration", "highlight": "For us specifically", "fa_type": null, "tid": "0796"}, {"id": "missed-expert-0842", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 0842", "date": "2026-10-30", "ts": "01:56", "quote": "We're closing the Manchester plant in March. The staff haven't been told yet, so please keep that between us.", "source": "written for the design", "cleared": null, "transcript": "missed-expert-0842", "fix": "declaration", "highlight": "We're closing the Manchester plant in March", "fa_type": null, "tid": "0863"}, {"id": "missed-expert-3370", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 3370", "date": "2026-11-07", "ts": "02:00", "quote": "Our roadmap has the analytics module launching in Q2, which is why we've been hiring so many data engineers.", "source": "written for the design", "cleared": null, "transcript": "missed-expert-3370", "fix": null, "highlight": "Our roadmap has the analytics module launching in Q2", "fa_type": null, "tid": "0246"}, {"id": "missed-expert-8778", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 8778", "date": "2026-11-18", "ts": "01:56", "quote": "We're about to lose our second-largest customer. I'm on the account team, and the renewal isn't going to happen.", "source": "written for the design", "cleared": null, "transcript": "missed-expert-8778", "fix": null, "highlight": "We're about to lose our second-largest customer", "fa_type": null, "tid": "0913"}, {"id": "missed-expert-6378", "kind": "missed", "category": "Source disclosure", "name": "Expert 6378", "date": "2026-11-09", "ts": "01:34", "quote": "My contact Person 2315, who runs procurement there now, told me last week they're ending contracts with two of those tool heir Q2 earnings call in August", "fa_type": "public-source", "tid": "0803"}, {"id": "false-alarm-expert-3985", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 3985", "date": "2026-11-14", "ts": "00:51", "quote": "As their annual report says, they've been closing stores in the north for two years, so the shift to online isn't new.", "source": "written for the design", "cleared": "Cites the published annual report", "transcript": "false-alarm-expert-3985", "fix": "sources", "highlight": "As their annual report says", "fa_type": "public-source", "tid": "0106"}, {"id": "false-alarm-expert-2518", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 2518", "date": "2026-11-19", "ts": "01:30", "quote": "The chief executive said on the results call that capital spending would rise next year, mostly on automation.", "source": "written for the design", "cleared": "Said publicly on the results call", "transcript": "false-alarm-expert-2518", "fix": "sources", "highlight": "said on the results call", "fa_type": "public-source", "tid": "0881"}, {"id": "false-alarm-expert-8418", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 8418", "date": "2026-10-28", "ts": "01:20", "quote": "We announced the Leeds office in a press release last month, so it's no secret we're expanding in the north.", "source": "written for the design", "cleared": "Announced in a press release", "transcript": "false-alarm-expert-8418", "fix": "sources", "highlight": "We announced the Leeds office in a press release", "fa_type": "public-source", "tid": "0570"}, {"id": "false-alarm-expert-1578", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 1578", "date": "2026-11-04", "ts": "01:56", "quote": "Our prices are on the website. The standard tier is £40 per user, and that hasn't changed this year.", "source": "written for the design", "cleared": "Published list price", "transcript": "false-alarm-expert-1578", "fix": "sources", "highlight": "Our prices are on the website", "fa_type": "public-source", "tid": "0525"}, {"id": "false-alarm-expert-8173", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 8173", "date": "2026-11-11", "ts": "00:52", "quote": "I can only tell you what's in our published sustainability report: we cut emissions by about a tenth last year.", "source": "written for the design", "cleared": "From the published sustainability report", "transcript": "false-alarm-expert-8173", "fix": "sources", "highlight": "what's in our published sustainability report", "fa_type": "public-source", "tid": "0637"}, {"id": "false-alarm-expert-0462", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 0462", "date": "2026-11-17", "ts": "01:22", "quote": "Our chief executive showed the new product on stage at the trade show in September, so it's public now.", "source": "written for the design", "cleared": "Shown publicly at a trade show", "transcript": "false-alarm-expert-0462", "fix": "sources", "highlight": "showed the new product on stage at the trade show", "fa_type": "public-source", "tid": "0515"}, {"id": "false-alarm-expert-6699", "kind": "false_alarm", "category": "Former-client confidential", "name": "Expert 6699", "date": "2026-10-29", "ts": "07:41", "quote": "My own estimate is that their margins are nearer 20% than 25%, based on industry benchmarks, not anything I worked on.", "source": "written for the design", "cleared": "The expert's own estimate, based on public benchmarks", "transcript": null, "fix": null, "highlight": "My own estimate", "fa_type": "own-view", "tid": "0917"}, {"id": "false-alarm-expert-4716", "kind": "false_alarm", "category": "Source disclosure", "name": "Expert 4716", "date": "2026-11-05", "ts": "13:22", "quote": "Nobody told me this, but my view is they'll have to raise prices within a year.", "source": "written for the design", "cleared": "A personal view, not attributed to any source", "transcript": null, "fix": null, "highlight": "Nobody told me this, but my view is", "fa_type": "own-view", "tid": "0906"}, {"id": "false-alarm-expert-0382", "kind": "false_alarm", "category": "Personal data", "name": "Expert 0382", "date": "2026-11-13", "ts": "19:58", "quote": "I think their new chief executive, Person 1134, is the right person for the turnaround, though that's only my opinion.", "source": "written for the design", "cleared": "An opinion about a public figure acting in a public role", "transcript": null, "fix": null, "highlight": "that's only my opinion", "fa_type": "own-view", "tid": "0122"}, {"id": "false-alarm-expert-6523", "kind": "false_alarm", "category": "Former-client confidential", "name": "Expert 6523", "date": "2026-10-31", "ts": "10:14", "quote": "When I was at Company 7278 in 2015, we set prices at cost plus a fixed margin. I've no idea what they do now.", "source": "written for the design", "cleared": "Left Company 7278 in 2016; nothing current", "transcript": null, "fix": null, "highlight": "When I was at Company 7278 in 2015", "fa_type": "former-employer", "tid": "0229"}, {"id": "false-alarm-expert-8012", "kind": "false_alarm", "category": "Declaration conflict", "name": "Expert 8012", "date": "2026-11-09", "ts": "04:37", "quote": "I left Company 7660 in 2017, and back then the plant ran three shifts.", "source": "written for the design", "cleared": "Consistent with the declaration; the detail is nine years old", "transcript": null, "fix": null, "highlight": "I left Company 7660 in 2017", "fa_type": "former-employer", "tid": "0616"}, {"id": "false-alarm-expert-1186", "kind": "false_alarm", "category": "Source disclosure", "name": "Expert 1186", "date": "2026-11-16", "ts": "22:45", "quote": "My old manager at Company 5364, back in 2014, always said they had built more network than they needed.", "source": "written for the design", "cleared": "A ten-year-old opinion about a former employer", "transcript": null, "fix": null, "highlight": "back in 2014", "fa_type": "former-employer", "tid": "0975"}, {"id": "false-alarm-expert-8831", "kind": "false_alarm", "category": "Personal data", "name": "Expert 8831", "date": "2026-10-30", "ts": "16:03", "quote": "Their chief executive, Person 0904, has said at two conferences that she'd consider selling the business.", "source": "written for the design", "cleared": "Public statements by a chief executive", "transcript": null, "fix": null, "highlight": "has said at two conferences", "fa_type": "market-talk", "tid": "0431"}, {"id": "false-alarm-expert-1923", "kind": "false_alarm", "category": "Source disclosure", "name": "Expert 1923", "date": "2026-11-07", "ts": "11:36", "quote": "A few people I met at the trade show think the merger will happen, but that's just the chatter going round.", "source": "written for the design", "cleared": "General market rumour; no insider named", "transcript": null, "fix": null, "highlight": "that's just the chatter going round", "fa_type": "market-talk", "tid": "0663"}, {"id": "false-alarm-expert-3201", "kind": "false_alarm", "category": "Source disclosure", "name": "Expert 3201", "date": "2026-11-18", "ts": "08:29", "quote": "According to the financial press, analysts expect Company 5640 to cut its dividend.", "source": "written for the design", "cleared": "Published analyst expectations", "transcript": null, "fix": null, "highlight": "According to the financial press", "fa_type": "market-talk", "tid": "0976"}], "transcripts": {"missed-expert-9928": {"topic": "Medical devices", "profile": "Expert 9928. Finance Director, Company 3966 (2018 to March 2026). Independent consultant (March 2026 to present). Industry: medical devices.", "declaration": "Left Company 3966 (listed company) in March 2026. No current employer in medical devices. Standard confidentiality obligations to Company 3966. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 9928, thanks for your time. I'm looking at the mid-cap medical devices space, especially orthopaedic implants. How is demand?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Strong. Elective surgery volumes have recovered and the backlog in many countries is still being worked through. Ageing populations make the long-term demand very predictable."}, {"ts": "00:35", "speaker": "INTERVIEWER", "text": "How about pricing?"}, {"ts": "00:38", "speaker": "EXPERT", "text": "Under pressure from hospital procurement, especially in Europe where tenders are aggressive. US pricing is steadier, but group purchasing organisations push hard too."}, {"ts": "01:00", "speaker": "INTERVIEWER", "text": "What about Company 3966 specifically?"}, {"ts": "01:03", "speaker": "EXPERT", "text": "I'll stay careful there since I only left in March. Generally, Company 3966 has a good product range and a solid hospital footprint."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "Anything investors should be aware of?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Look, I'm not saying anything specific, but if I were you I'd watch their Q3 numbers closely. Let's just say there's been some noise around one of their knee replacement devices, and I still talk to people there. Quality issues take a while to show up in the numbers."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "Okay. Going back to the market, how important is regulation?"}, {"ts": "01:57", "speaker": "EXPERT", "text": "Very. The EU medical device regulation raised the bar for clinical evidence. Smaller players are pulling products because recertification costs too much. That's good for the bigger, well-capitalised companies."}, {"ts": "02:25", "speaker": "INTERVIEWER", "text": "And robotics in orthopaedics?"}, {"ts": "02:29", "speaker": "EXPERT", "text": "It's the main arms race. Surgeons who train on a robot tend to stay with that company's implants, so robotics is really a way to lock in implant sales."}, {"ts": "02:50", "speaker": "INTERVIEWER", "text": "Thank you, Expert 9928."}], "passage_ts": "01:24", "reviewer_comment": "The expert left Company 3966, a listed company, in March 2026 and says he still speaks to people there. He hints at a quality problem with one of its knee replacement devices that has not yet shown in its results. That may be inside information.\n\nSaying “I'm not saying anything specific” does not make it safe. We redacted the passage and escalated it.", "root_cause": "The AI only checks answers that name a company, and this one says “their” instead. The human reviewer's conclusion also relies on a fact that is not in the transcript: that Company 3966 is a listed company. The reviewer probably checked another source, such as the expert's declaration. The AI reads neither the question before the answer nor the declaration, so it could not link “their” to Company 3966 or see that the company is listed.", "source": "test set, transcript 5", "id": "missed-expert-9928", "kind": "missed", "category": "Material non-public information", "name": "Expert 9928", "date": "2026-11-12", "role": "Finance Director, Company 3966 (2018 to March 2026). Independent consultant (March 2026 to present).", "reviewer": "Reviewer 6689, Legal Counsel (internal)", "reviewed_at": "2026-11-13T09:42", "entities": {"Company 3966": ["listed", "expert's former employer (left March 2026)"], "Expert 9928": ["the expert"]}, "tid": "0702"}, "missed-expert-6456": {"topic": "Diabetes drug approvals", "profile": "Expert 6456. Regulatory Affairs Manager, Company 4794 (2016 to 2022). Principal Consultant, Company 6393 (2022 to present). Industry: pharmaceuticals, regulatory affairs.", "declaration": "Currently a consultant at Company 6393, which advises listed drug developers on regulatory submissions; Company 4354 (listed company) is a current client. Must not discuss any client's non-public regulatory, clinical or commercial information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Thanks for joining, Expert 6456. I'm looking at diabetes and weight-loss drugs, and how regulators are treating the newer once-weekly treatments. Where are we in the cycle?"}, {"ts": "00:16", "speaker": "EXPERT", "text": "We're in a busy phase. After the first wave of once-weekly injectables, regulators have a clearer template for what they want to see, so submissions are better prepared. The questions have moved on from whether these drugs work to long-term safety, especially heart outcomes and muscle loss."}, {"ts": "00:52", "speaker": "INTERVIEWER", "text": "How long are reviews taking at the moment?"}, {"ts": "00:57", "speaker": "EXPERT", "text": "Standard reviews are running close to the published timelines, roughly a year. Where it slips is when the regulator asks for more data mid-review. That can add six months, and smaller companies often haven't budgeted for it."}, {"ts": "01:31", "speaker": "INTERVIEWER", "text": "What tends to trigger those requests?"}, {"ts": "01:36", "speaker": "EXPERT", "text": "Usually the safety database is too small, or the trial population doesn't match the patients who'll actually get the drug. Manufacturing is the other one. Inspectors find problems at a contract manufacturer and the whole file stalls."}, {"ts": "02:10", "speaker": "INTERVIEWER", "text": "Company 4354 has its once-weekly diabetes drug under review. How do you rate their chances?"}, {"ts": "02:17", "speaker": "EXPERT", "text": "Between us, the regulator's decision on their diabetes drug came back last week, and it's a rejection. They haven't announced it yet."}, {"ts": "02:34", "speaker": "INTERVIEWER", "text": "Let's go back to the wider market. How are health systems responding to the price of these drugs?"}, {"ts": "02:41", "speaker": "EXPERT", "text": "Cautiously, in most of Europe. Health systems are limiting access to patients with the highest body mass index or existing heart disease, and pushing for deals linked to outcomes. Volumes will grow, but the price per patient will keep falling."}, {"ts": "03:18", "speaker": "INTERVIEWER", "text": "Thanks, Expert 6456."}], "passage_ts": "02:17", "reviewer_comment": "The expert advises Company 4354 on its regulatory submissions. He disclosed that the regulator has rejected its diabetes drug, which has not been announced. That is inside information. We redacted the passage, withheld the transcript from the client and referred the expert to the vetting team.", "root_cause": "The AI assessed the answer on its own. The answer names no company: “their” refers back to Company 4354 in the question. Without that link, the AI did not connect the answer to the client named in the declaration, and treated “the regulator's decision” as general comment.", "source": "written for the prototype", "id": "missed-expert-6456", "kind": "missed", "category": "Material non-public information", "name": "Expert 6456", "date": "2026-10-29", "role": "Regulatory Affairs Manager, Company 4794 (2016 to 2022). Principal Consultant, Company 6393 (2022 to present).", "reviewer": "Reviewer 8559, Senior Compliance Manager (internal)", "reviewed_at": "2026-10-31T11:17", "entities": {"Company 4354": ["listed", "named in the call"], "Company 4794": ["expert's former employer (left 2022)"], "Company 6393": ["expert's current employer"], "Expert 6456": ["the expert"]}, "tid": "0101"}, "missed-expert-3657": {"topic": "European tyre market", "profile": "Expert 3657. Plant Manager, Company 4907 (2012 to 2019). Head of Corporate Strategy, Company 3068 (2019 to present). Industry: automotive components and tyres.", "declaration": "Currently employed by Company 3068 (listed company), which owns a European tyre business. May discuss the tyre and components market in general. Must not discuss Company 3068's non-public information, financials, strategy or corporate activity.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 3657, thanks for your time. I'm researching the European tyre market. How healthy is it right now?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Mixed. Replacement tyres are steady, because people keep driving older cars for longer. Volumes for new cars follow vehicle production, which is still below where it was before the pandemic. And Asian imports have taken a big share of the budget end."}, {"ts": "00:46", "speaker": "INTERVIEWER", "text": "How are European producers responding to the imports?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "By moving up the range. Premium and large-rim tyres, winter and all-season, and tyres designed for electric vehicles, which carry more weight and need to run quietly. The budget segment is very hard to defend with European energy and labour costs."}, {"ts": "01:28", "speaker": "INTERVIEWER", "text": "Is there pressure to consolidate?"}, {"ts": "01:33", "speaker": "EXPERT", "text": "Yes. A lot of diversified component groups are asking whether they should own tyre plants at all. Tyres are capital heavy, and the margins are thinner than in electronics or software-rich parts."}, {"ts": "02:05", "speaker": "INTERVIEWER", "text": "Are any of the groups actually acting on that?"}, {"ts": "02:10", "speaker": "EXPERT", "text": "The board approved the sale of the European tyre business on Tuesday. The announcement is planned for after the half-year results."}, {"ts": "02:28", "speaker": "INTERVIEWER", "text": "Moving on, how much are electric vehicles changing the replacement cycle?"}, {"ts": "02:34", "speaker": "EXPERT", "text": "Quite a lot. Electric cars are heavier and deliver torque instantly, so tyres wear faster, often 20 to 30% sooner. That's good for replacement volumes, and drivers seem willing to pay more for tyres approved for their car."}, {"ts": "03:08", "speaker": "INTERVIEWER", "text": "And raw materials?"}, {"ts": "03:12", "speaker": "EXPERT", "text": "Natural rubber prices have been volatile, and the new European deforestation rules mean producers must trace rubber back to the plantation. That adds cost and favours the bigger groups that already have traceability systems."}], "passage_ts": "02:10", "reviewer_comment": "Expert 3657 heads strategy at Company 3068, a listed company. He disclosed that its board has approved the sale of its European tyre business, before any announcement. We rejected the transcript and escalated the expert for breaching his declaration.", "root_cause": "The expert said “the board”, not “our board”, and did not name Company 3068, so the AI read the answer as comment on the sector. The problem only shows against the declaration, which says he works in strategy at a listed group with a European tyre business. The AI did not make that comparison.", "source": "written for the prototype", "id": "missed-expert-3657", "kind": "missed", "category": "Material non-public information", "name": "Expert 3657", "date": "2026-11-05", "role": "Plant Manager, Company 4907 (2012 to 2019). Head of Corporate Strategy, Company 3068 (2019 to present).", "reviewer": "Reviewer 6689, Legal Counsel (internal)", "reviewed_at": "2026-11-06T14:05", "entities": {"Company 3068": ["listed", "expert's current employer"], "Company 4907": ["expert's former employer (left 2019)"], "Expert 3657": ["the expert"]}, "tid": "0003"}, "missed-expert-7520": {"topic": "Food packaging supply", "profile": "Expert 7520. Account Manager, Company 2924 (2014 to 2018). Key Account Director, Company 2161 (2018 to August 2026). Independent packaging consultant (August 2026 to present). Industry: food and drink packaging.", "declaration": "Left Company 2161 (listed company) in August 2026. No current employer. Standard confidentiality obligations to Company 2161, including its customer contracts. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 7520, thanks for joining. I'm looking at packaging suppliers to the big food manufacturers. How do those contracts usually work?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Most large food companies run tenders every three to five years for their main packaging categories: cartons, films, trays. The contracts set volumes and a price formula, with pass-through clauses for board, resin and energy costs."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "How sticky are the customers?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "Stickier than people think. Switching means new tooling, line trials and food safety sign-off, which can take most of a year. So incumbents usually keep the business unless service or quality has gone badly wrong."}, {"ts": "01:25", "speaker": "INTERVIEWER", "text": "And how concentrated are the suppliers' customer books?"}, {"ts": "01:30", "speaker": "EXPERT", "text": "Very, for the mid-sized listed players. It's common for the top three customers to be half of revenue. That's fine while things are good, but one lost tender can move the whole year."}, {"ts": "02:02", "speaker": "INTERVIEWER", "text": "Is that a live risk at Company 2161?"}, {"ts": "02:07", "speaker": "EXPERT", "text": "Their biggest customer has given notice on the five-year supply deal. That's about a fifth of revenue, and the market doesn't know."}, {"ts": "02:24", "speaker": "INTERVIEWER", "text": "Let's talk about sustainability. How is the plastic packaging tax changing demand?"}, {"ts": "02:30", "speaker": "EXPERT", "text": "It's pushing customers towards recycled content and paper-based formats. Suppliers that secured recycled resin early are winning share, and the others are either paying the tax or losing the work."}, {"ts": "03:02", "speaker": "INTERVIEWER", "text": "What about automation in packaging plants?"}, {"ts": "03:06", "speaker": "EXPERT", "text": "Mostly in quality inspection now. Camera systems catch print and seal defects that people used to miss, and that cuts customer complaints. It's a quick payback, often under two years."}], "passage_ts": "02:07", "reviewer_comment": "The expert left Company 2161, a listed company, in August. She disclosed that its largest customer, worth about a fifth of revenue, has given notice, and said the market does not know. We redacted the passage and referred the expert to the vetting team.", "root_cause": "The AI treated the answer as an example of the expert's general point about customer concentration. It gave no weight to “the market doesn't know”, and did not check that she had left Company 2161 three months before the call.", "source": "written for the prototype", "id": "missed-expert-7520", "kind": "missed", "category": "Material non-public information", "name": "Expert 7520", "date": "2026-11-10", "role": "Account Manager, Company 2924 (2014 to 2018). Key Account Director, Company 2161 (2018 to August 2026). Independent packaging consultant (August 2026 to present).", "reviewer": "Reviewer 8559, Senior Compliance Manager (internal)", "reviewed_at": "2026-11-12T16:38", "entities": {"Company 2161": ["listed", "expert's former employer (left August 2026)"], "Company 2924": ["expert's former employer (left 2018)"], "Expert 7520": ["the expert"]}, "tid": "0012"}, "missed-expert-0937": {"topic": "Industrial pumps distribution", "profile": "Expert 0937. Regional Sales Manager, Company 5308 (2014 to 2021). Commercial Director, Company 6700 (2021 to present). Industry: industrial equipment distribution.", "declaration": "Currently employed by Company 6700, the main UK distributor for Company 6650 (listed company). May discuss the industrial equipment market in general. Must not share Company 6700's or Company 6650's non-public sales, order or pricing data.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 0937, thanks for joining. I'm looking at demand for industrial pumps and valves in the UK. How does the market feel?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Subdued. Water companies are spending, because the new regulatory period has a big investment programme, but general manufacturing has been cautious all year. Customers are repairing rather than replacing where they can."}, {"ts": "00:45", "speaker": "INTERVIEWER", "text": "How much of the market goes through distributors?"}, {"ts": "00:49", "speaker": "EXPERT", "text": "Most of the smaller orders. Manufacturers sell large engineered pumps direct, but standard units and spares go through distributors, who hold stock and offer next-day delivery. It's really a service business."}, {"ts": "01:22", "speaker": "INTERVIEWER", "text": "What are you seeing on pricing?"}, {"ts": "01:26", "speaker": "EXPERT", "text": "Manufacturers pushed through big increases in 2022 and 2023. This year it's been flat to slightly up. Customers are asking two or three suppliers for quotes before they order."}, {"ts": "01:58", "speaker": "INTERVIEWER", "text": "How do you see Company 6650 heading into the year end?"}, {"ts": "02:03", "speaker": "EXPERT", "text": "I'd expect them to miss their profit forecast. The October order book I saw was down about 15% on last year."}, {"ts": "02:20", "speaker": "INTERVIEWER", "text": "Turning to water, how long will that investment cycle run?"}, {"ts": "02:26", "speaker": "EXPERT", "text": "Five years at least, and the spending is weighted towards the later years. Water companies are under pressure on leaks and sewage overflows, so pumping stations and network upgrades are high on the list. Contractors are more of a bottleneck than equipment."}, {"ts": "03:00", "speaker": "INTERVIEWER", "text": "Any view on energy efficiency rules?"}, {"ts": "03:04", "speaker": "EXPERT", "text": "They help replacement demand. Older motors and pumps can use far more energy than modern variable-speed units, so customers with high power bills can justify a swap on payback alone."}], "passage_ts": "02:03", "reviewer_comment": "The expert is Company 6650's main distributor and sees its order data. He disclosed a fall in its order book that points to the company missing its published forecast (its guidance). Company 6650 is listed. We redacted the passage and reminded the expert of his restrictions.", "root_cause": "The AI recorded “I'd expect them to miss their profit forecast” as the expert's own forecast and treated the passage as opinion. It missed that “the order book I saw” means he had seen Company 6650's internal data, through the distribution relationship recorded in his declaration.", "source": "written for the prototype", "id": "missed-expert-0937", "kind": "missed", "category": "Material non-public information", "name": "Expert 0937", "date": "2026-11-16", "role": "Regional Sales Manager, Company 5308 (2014 to 2021). Commercial Director, Company 6700 (2021 to present).", "reviewer": "Reviewer 6689, Legal Counsel (internal)", "reviewed_at": "2026-11-17T10:26", "entities": {"Company 5308": ["expert's former employer (left 2021)"], "Company 6650": ["listed", "named in the call"], "Company 6700": ["expert's current employer"], "Expert 0937": ["the expert"]}, "tid": "0749"}, "missed-expert-1342": {"topic": "Workforce SaaS pricing", "profile": "Expert 1342. VP Sales EMEA, Company 5981 (2021 to present). Previously Sales Director, Company 6065 (2016 to 2021). Industry: B2B SaaS, workforce scheduling software.", "declaration": "Currently employed by Company 5981 (private company). May discuss the workforce software market, buyer behaviour and competitors in general terms. Must not share Company 5981's non-public pricing, roadmap or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 1342, thanks for joining. I'm looking at the workforce scheduling software market in Europe. How would you describe demand right now?"}, {"ts": "00:14", "speaker": "EXPERT", "text": "Healthy but more scrutinised. Two years ago, buyers were adding tools quickly. Now every purchase goes through finance, and they want a clear payback, usually within a year."}, {"ts": "00:36", "speaker": "INTERVIEWER", "text": "Who are the typical buyers?"}, {"ts": "00:39", "speaker": "EXPERT", "text": "Operations leaders in retail, hospitality and healthcare. HR is involved, but operations owns the budget because scheduling directly drives labour cost, which is often their biggest line."}, {"ts": "01:02", "speaker": "INTERVIEWER", "text": "How competitive is pricing?"}, {"ts": "01:06", "speaker": "EXPERT", "text": "Competitive at the low end, where you have lots of simple tools. At the enterprise end, it's more about integration with payroll and time-and-attendance systems. Switching costs are high once you're integrated."}, {"ts": "01:30", "speaker": "INTERVIEWER", "text": "Are vendors pushing price increases?"}, {"ts": "01:34", "speaker": "EXPERT", "text": "Most of the market is trying. For us specifically, we're moving list price up 12% on the mid-market tier from January. It's been approved, and sales got the presentation last week, but customers haven't been told yet. We think churn risk is low because of the integrations."}, {"ts": "02:01", "speaker": "INTERVIEWER", "text": "Interesting. How do buyers usually react to increases like that?"}, {"ts": "02:06", "speaker": "EXPERT", "text": "In general, they push back, then accept if the vendor shows new value at the same time, a new module or better reporting. The ones who churn are usually the smaller accounts who were price shopping anyway."}, {"ts": "02:31", "speaker": "INTERVIEWER", "text": "What about AI features in scheduling?"}, {"ts": "02:35", "speaker": "EXPERT", "text": "Everyone is adding demand forecasting. The useful version predicts footfall or patient volume and builds a draft rota. The hype version is a chatbot on top. Buyers are getting better at telling the difference."}, {"ts": "03:00", "speaker": "INTERVIEWER", "text": "Which segment is growing fastest?"}, {"ts": "03:03", "speaker": "EXPERT", "text": "Healthcare. Staffing pressures are severe, agency costs are high, and better scheduling reduces agency spend directly. That's an easy business case."}, {"ts": "03:25", "speaker": "INTERVIEWER", "text": "Thank you, Expert 1342."}], "passage_ts": "01:34", "reviewer_comment": "The expert disclosed a price increase at her current employer that customers have not yet been told about. This breaches her declaration. We redacted the passage and reminded her of her restrictions.", "root_cause": "The AI only checks answers that name a company. This answer says “for us”. Linking it to Company 5981, her current employer, needed her declaration, which the AI does not read.", "source": "test set, transcript 3", "id": "missed-expert-1342", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 1342", "date": "2026-11-04", "role": "VP Sales EMEA, Company 5981 (2021 to present). Previously Sales Director, Company 6065 (2016 to 2021).", "reviewer": "Reviewer 5546, Compliance Analyst (internal)", "reviewed_at": "2026-11-06T12:51", "entities": {"Company 5981": ["private", "expert's current employer"], "Company 6065": ["expert's former employer (left 2021)"], "Expert 1342": ["the expert"]}, "tid": "0796"}, "missed-expert-0842": {"topic": "UK household goods manufacturing", "profile": "Expert 0842. Production Engineer, Company 2597 (2015 to 2020). Operations Director, Company 9237 (2020 to present). Industry: household goods manufacturing.", "declaration": "Currently employed by Company 9237 (private company). May discuss UK manufacturing trends in general. Must not share Company 9237's non-public plans, site decisions, financials or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 0842, thanks for your time. I'm researching UK manufacturers of household goods. What's the biggest pressure on them at the moment?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Energy and labour, in that order. Moulding and finishing use a lot of power, and contracts signed in 2022 and 2023 are only now rolling off. Wages have also risen fast, especially for skilled maintenance engineers."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How are manufacturers responding?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Consolidating sites. A lot of these businesses grew by acquisition and ended up with four or five small plants. Running two bigger, more automated ones is cheaper, even after redundancy and moving costs."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "Is that happening across the sector?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Broadly, yes. Most mid-sized groups have a footprint review going on. The north west has been hit hardest, because many of the older plants are there."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "Are you seeing that in your own business?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "We're closing the Manchester plant in March. The staff haven't been told yet, so please keep that between us."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Understood. Back to the wider market, how do retailers behave as customers?"}, {"ts": "02:18", "speaker": "EXPERT", "text": "They're tough. They want lower prices and smaller, more frequent deliveries. Manufacturers with good forecasting and flexible lines cope. The ones that run long batches end up holding stock."}, {"ts": "02:58", "speaker": "INTERVIEWER", "text": "Where does automation make the most sense?"}, {"ts": "03:02", "speaker": "EXPERT", "text": "Palletising and packing at the end of the line. It's repetitive, it's hard to staff, and the robots are proven. Moulding itself is already fairly automated, so the gains there are smaller."}], "passage_ts": "01:56", "reviewer_comment": "The expert works at Company 9237. She disclosed a plant closure that has not been announced, even to staff. Her declaration prohibits this. We redacted the passage and reminded her of her restrictions.", "root_cause": "The AI read “we” as the industry and treated the answer as an example of the sector-wide closures the expert had just described. It did not use the declaration to link “we” to Company 9237, and took “keep that between us” as a figure of speech rather than a sign that the information is confidential.", "source": "written for the prototype", "id": "missed-expert-0842", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 0842", "date": "2026-10-30", "role": "Production Engineer, Company 2597 (2015 to 2020). Operations Director, Company 9237 (2020 to present).", "reviewer": "Reviewer 8404, Compliance Analyst (internal)", "reviewed_at": "2026-10-31T15:09", "entities": {"Company 2597": ["expert's former employer (left 2020)"], "Company 9237": ["private", "expert's current employer"], "Expert 0842": ["the expert"]}, "tid": "0863"}, "missed-expert-3370": {"topic": "Retail point-of-sale software", "profile": "Expert 3370. Software Engineer, Company 1849 (2014 to 2019). Engineering Manager, Company 0973 (2019 to present). Industry: retail point-of-sale and analytics software.", "declaration": "Currently employed by Company 0973 (private company). May discuss the retail software market and hiring trends in general. Must not share Company 0973's non-public roadmap, pricing or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 3370, thanks for joining. I'm looking at point-of-sale software for mid-sized retailers. What are buyers asking for now?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Fewer systems. Retailers used to buy tills, stock control, loyalty and online separately and then pay to connect them. Now they want one platform that sees stock and customers across stores and online."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How hard is it for vendors to deliver that?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Hard. Most vendors started with tills and bolted on the rest. Rebuilding on a single data model is a job of several years, and retailers notice the joins."}, {"ts": "01:18", "speaker": "INTERVIEWER", "text": "What's the hiring market like for engineers in this space?"}, {"ts": "01:22", "speaker": "EXPERT", "text": "Tight for data skills, looser for general web developers. Every vendor wants people who can build reporting and forecasting on top of transaction data. Pay for data engineers has held up even as the wider tech market cooled."}, {"ts": "01:56", "speaker": "INTERVIEWER", "text": "Is Company 0973 hiring?"}, {"ts": "02:00", "speaker": "EXPERT", "text": "Our roadmap has the analytics module launching in Q2, which is why we've been hiring so many data engineers."}, {"ts": "02:14", "speaker": "INTERVIEWER", "text": "Let's talk about pricing models. How do vendors charge?"}, {"ts": "02:19", "speaker": "EXPERT", "text": "Mostly per store per month, with payment processing on top. Payments is where a lot of the margin comes from, so some vendors discount the software to win the processing."}, {"ts": "02:56", "speaker": "INTERVIEWER", "text": "What makes retailers switch?"}, {"ts": "03:00", "speaker": "EXPERT", "text": "Usually an outage at a busy time, or a new owner who wants one system across the estate. Otherwise switching is painful, so contracts tend to renew."}], "passage_ts": "02:00", "reviewer_comment": "The expert works at Company 0973. He gave the launch date of a product on its roadmap, which is not public and which his declaration prohibits. We redacted that sentence; the discussion of hiring around it was acceptable.", "root_cause": "The AI grouped this answer with the two before it, which were about hiring, and treated it as comment on the labour market, which the declaration permits. It did not pick out the launch date, which is the confidential part.", "source": "written for the prototype", "id": "missed-expert-3370", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 3370", "date": "2026-11-07", "role": "Software Engineer, Company 1849 (2014 to 2019). Engineering Manager, Company 0973 (2019 to present).", "reviewer": "Reviewer 8705, Compliance Analyst (internal)", "reviewed_at": "2026-11-09T09:42", "entities": {"Company 0973": ["private", "expert's current employer"], "Company 1849": ["expert's former employer (left 2019)"], "Expert 3370": ["the expert"]}, "tid": "0246"}, "missed-expert-8778": {"topic": "Outsourced facilities management", "profile": "Expert 8778. Account Manager, Company 1746 (2015 to 2021). Senior Account Director, Company 7200 (2021 to present). Industry: outsourced facilities management.", "declaration": "Currently employed by Company 7200 (private company). May discuss the facilities management market in general. Must not share Company 7200's non-public customer, contract or financial information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 8778, thanks for joining. I'm researching outsourced facilities management in the UK. How is the market doing?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Growing slowly. Office demand is still lower than before the pandemic, but hospitals, universities and logistics sites have picked up some of the slack. Clients want fewer providers covering more services."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How long do contracts usually run?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Three to five years for most corporate clients, longer in the public sector. Renewal rates are high in general, because switching providers means transferring staff, and that's a lot of work for the client."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "What makes a client leave?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Service failures that reach senior management, usually cleaning or security. Or a new procurement lead who wants to retender everything to show savings."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "How are things on your side at the moment?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "We're about to lose our second-largest customer. I'm on the account team, and the renewal isn't going to happen."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Moving to costs, how is the National Living Wage affecting margins?"}, {"ts": "02:18", "speaker": "EXPERT", "text": "It's the biggest single issue. Labour is most of the cost base, so every rise has to be passed through. Contracts with proper indexation are fine. Older fixed-price contracts are where providers lose money."}, {"ts": "02:58", "speaker": "INTERVIEWER", "text": "And technology?"}, {"ts": "03:02", "speaker": "EXPERT", "text": "Sensors that let you clean based on use rather than a fixed rota, and better scheduling apps for mobile engineers. Clients like the data because it shows them what they're paying for."}], "passage_ts": "01:56", "reviewer_comment": "The expert is on the account team at Company 7200, her current employer. She disclosed that it is about to lose its second-largest customer. Under her declaration, that is confidential customer information. We redacted the passage and reminded her of her restrictions.", "root_cause": "The AI's confidentiality check looks for specifics such as a customer name, a contract value or a date. It found none and scored the answer as low risk. It missed that an employee saying a major customer is about to leave is confidential in itself.", "source": "written for the prototype", "id": "missed-expert-8778", "kind": "missed", "category": "Current-employer confidential", "name": "Expert 8778", "date": "2026-11-18", "role": "Account Manager, Company 1746 (2015 to 2021). Senior Account Director, Company 7200 (2021 to present).", "reviewer": "Reviewer 5546, Compliance Analyst (internal)", "reviewed_at": "2026-11-19T11:17", "entities": {"Company 1746": ["expert's former employer (left 2021)"], "Company 7200": ["private", "expert's current employer"], "Expert 8778": ["the expert"]}, "tid": "0913"}, "missed-expert-6378": {"topic": "Enterprise software buying", "profile": "Expert 6378. Head of Procurement, Company 9560 (2019 to October 2024, per declaration). Independent procurement advisor (October 2024 to present). Industry: enterprise data and analytics software.", "declaration": "Left Company 9560 in October 2024. No current employer. Not in contact with Company 9560 in a professional capacity. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 6378, thanks for joining. I'm researching how large enterprises buy data and analytics software. What does a typical buying process look like?"}, {"ts": "00:14", "speaker": "EXPERT", "text": "Long. Six to twelve months for a big platform. You have IT, security, procurement and the business all involved. Security review alone can take two or three months."}, {"ts": "00:36", "speaker": "INTERVIEWER", "text": "Where do deals usually stall?"}, {"ts": "00:40", "speaker": "EXPERT", "text": "Security and legal. Vendors underestimate how many questions a large company's security team will ask, especially about where data is stored and who can access it."}, {"ts": "01:02", "speaker": "INTERVIEWER", "text": "How are enterprises approaching vendor consolidation?"}, {"ts": "01:06", "speaker": "EXPERT", "text": "Aggressively. Most companies have too many overlapping tools. At Company 9560, our team is rolling out a consolidation programme next month, cutting the analytics stack from nine vendors to four. We've been building the business case since the summer."}, {"ts": "01:30", "speaker": "INTERVIEWER", "text": "Which vendors are likely to lose?"}, {"ts": "01:34", "speaker": "EXPERT", "text": "The niche dashboard tools. My contact Person 2315, who runs procurement there now, told me last week they're ending contracts with two of those tools in Q1. The big platforms will win because they can bundle."}, {"ts": "01:55", "speaker": "INTERVIEWER", "text": "In general, how do vendors defend against consolidation?"}, {"ts": "01:59", "speaker": "EXPERT", "text": "Deep integration and proving usage. If a vendor can show that hundreds of people use the tool daily, it's hard to cut. If usage is concentrated in one team, it's an easy target."}, {"ts": "02:20", "speaker": "INTERVIEWER", "text": "What about pricing models?"}, {"ts": "02:24", "speaker": "EXPERT", "text": "Buyers are pushing back on per-seat pricing for analytics, because usage is uneven. Consumption-based pricing is growing, but finance teams worry about unpredictable bills, so many deals end up with a committed spend plus overage."}, {"ts": "02:50", "speaker": "INTERVIEWER", "text": "Thanks, Expert 6378."}], "passage_ts": "01:34", "reviewer_comment": "The expert names a current insider as the source of non-public decisions about suppliers. This also contradicts her declaration that she has no professional contact with Company 9560. We rejected the transcript and referred the expert to the vetting team.", "root_cause": "The AI checks for company names, and the answer names none: “there” refers back to Company 9560. It did not treat “my contact Person 2315 … told me” as naming an inside source.", "source": "test set, transcript 6", "id": "missed-expert-6378", "kind": "missed", "category": "Source disclosure", "name": "Expert 6378", "date": "2026-11-09", "role": "Head of Procurement, Company 9560 (2019 to October 2024, per declaration). Independent procurement advisor (October 2024 to present).", "reviewer": "Reviewer 8404, Compliance Analyst (internal)", "reviewed_at": "2026-11-11T14:05", "entities": {"Company 9560": ["expert's former employer"], "Expert 6378": ["the expert"], "Person 2315": ["third party named in the call"]}, "tid": "0837"}, "missed-expert-3658": {"topic": "Financial crime (AI-led)", "profile": "Expert 3658. Senior Manager, Financial Crime Advisory, Company 7122 (2016 to 2023), where she audited banks' anti-money-laundering controls. Head of Compliance, Company 1936 (2023 to present). Industry: financial crime compliance.", "declaration": "Currently employed by Company 1936; will not discuss Company 1936. Left Company 7122 in 2023. Bound by confidentiality to Company 7122's former clients. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "AI INTERVIEWER", "text": "Thank you for joining. This interview focuses on anti-money-laundering controls in mid-sized UK banks. First question: what are the most common weaknesses you have seen?"}, {"ts": "00:15", "speaker": "EXPERT", "text": "The most common is customer due diligence, especially source of funds for higher-risk customers. Banks collect the documents at onboarding but don't refresh them. Second is transaction monitoring that generates too many false alerts, so analysts burn out and miss the real ones."}, {"ts": "00:48", "speaker": "AI INTERVIEWER", "text": "Can you give an example of how severe these gaps can be?"}, {"ts": "00:53", "speaker": "EXPERT", "text": "At one of the banks we audited, Company 0710, around 40% of the higher-risk customer files we sampled were missing source-of-funds documentation. It was in our final report to their board. They had to run a full remediation programme."}, {"ts": "01:20", "speaker": "AI INTERVIEWER", "text": "How do banks typically respond to findings like that?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "A remediation programme, usually with external help, and a lot of pressure on the compliance team. It's tough on people. I remember Person 8435, who led their financial crime team at the time, was on sick leave for months after a mental breakdown."}, {"ts": "01:48", "speaker": "AI INTERVIEWER", "text": "What separates banks that manage this well?"}, {"ts": "01:52", "speaker": "EXPERT", "text": "Ownership in the first line. When relationship managers own the quality of customer files, rather than leaving it all to compliance, you get far better results. And good monitoring tuning: fewer, better alerts."}, {"ts": "02:15", "speaker": "AI INTERVIEWER", "text": "How is technology changing transaction monitoring?"}, {"ts": "02:19", "speaker": "EXPERT", "text": "Machine learning is reducing false positives in the better systems, sometimes significantly. But regulators want explainability. If a model closes an alert, the bank needs to show why. Black-box models are a hard sell to the regulator."}, {"ts": "02:45", "speaker": "AI INTERVIEWER", "text": "Final question: what should investors in bank technology watch?"}, {"ts": "02:49", "speaker": "EXPERT", "text": "Vendors that combine monitoring with case management and a clear audit trail. Regulators care less about how clever the model is and more about whether the bank can evidence its decisions."}, {"ts": "03:10", "speaker": "AI INTERVIEWER", "text": "Thank you. This transcript was generated from an AI-led interview."}], "passage_ts": "01:24", "reviewer_comment": "The expert names a private individual together with details of their health. We redacted the passage.", "root_cause": "The AI only looks for information about companies. A private individual's name and health details are outside what it checks, so the answer passed.", "source": "test set, transcript 8", "id": "missed-expert-3658", "kind": "missed", "category": "Personal data", "name": "Expert 3658", "date": "2026-11-13", "role": "Senior Manager, Financial Crime Advisory, Company 7122 (2016 to 2023), where she audited banks' anti-money-laundering controls. Head of Compliance, Company 1936 (2023 to present).", "reviewer": "Reviewer 8705, Compliance Analyst (internal)", "reviewed_at": "2026-11-14T16:38", "entities": {"Company 0710": ["named in the call"], "Company 1936": ["expert's current employer"], "Company 7122": ["expert's former employer (left 2023)"], "Expert 3658": ["the expert"], "Person 8435": ["third party named in the call"]}, "tid": "0629"}, "false-alarm-expert-9432": {"topic": "Road freight consolidation", "profile": "Expert 9432. Regional Operations Manager, Company 5485 (2019 to present). Previously Depot Manager, Company 5707 (2014 to 2019). Industry: road freight and logistics.", "declaration": "Currently employed by Company 5485 (listed company). May discuss general industry trends. Must not discuss Company 5485's non-public information, financials, strategy or corporate activity.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Hi Expert 9432, thanks for your time. I'm researching consolidation in UK road freight. How fragmented is the market today?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Very. There are a handful of large national players and then thousands of small operators, many of them family businesses with ten or twenty trucks. Driver shortages and fuel costs have pushed a lot of the small ones to the edge, so consolidation has been happening for years."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "What's driving deals at the larger end?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Network density, mainly. If you can fill trucks on the return leg, your economics change completely. And customers increasingly want one provider across the country, not five regional ones."}, {"ts": "01:15", "speaker": "INTERVIEWER", "text": "Are there obvious targets?"}, {"ts": "01:19", "speaker": "EXPERT", "text": "Publicly, people talk about the mid-sized regional players. Company 0615 is the one everyone mentions, they're strong in the North West and Scotland."}, {"ts": "01:35", "speaker": "INTERVIEWER", "text": "Do you think Company 0615 stays independent?"}, {"ts": "01:39", "speaker": "EXPERT", "text": "Honestly? I'd be surprised if Company 0615 is still independent by spring. I probably shouldn't say much more, but we've had integration planning sessions already. They're staffing the integration team from our side, and there's a project codename going around internally. The board's signed off on it, it's just timing on the announcement."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Okay. Let's step back to the broader market. How are fuel costs affecting pricing?"}, {"ts": "02:20", "speaker": "EXPERT", "text": "Fuel surcharges are standard now, so most of the volatility gets passed through. The bigger issue is driver wages. They're up a lot over three years and they don't come back down. Operators who didn't lock in rate increases are hurting."}, {"ts": "02:51", "speaker": "INTERVIEWER", "text": "And electrification?"}, {"ts": "02:55", "speaker": "EXPERT", "text": "Early. Electric vans for last mile, yes. Heavy goods vehicles, still mostly pilots. Charging at depots is the bottleneck, grid connections can take years. Hydrogen gets talked about, but I don't see it at scale this decade."}, {"ts": "03:28", "speaker": "INTERVIEWER", "text": "Where's the margin opportunity for operators?"}, {"ts": "03:32", "speaker": "EXPERT", "text": "Contract logistics rather than spot freight. Multi-year contracts with warehousing attached are stickier and better margin. Spot is a race to the bottom when capacity is loose."}, {"ts": "04:00", "speaker": "INTERVIEWER", "text": "Thanks, Expert 9432."}], "passage_ts": "01:19", "reviewer_comment": "The expert repeats market speculation that Company 0615 is a likely target. It is public talk, and Company 0615 is not his employer. Cleared.", "root_cause": "The AI flags every answer that names a company. It matched “Company 0615” and did not consider that the expert presented it as public talk.", "source": "test set, transcript 2", "id": "false-alarm-expert-9432", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 9432", "date": "2026-11-03", "role": "Regional Operations Manager, Company 5485 (2019 to present). Previously Depot Manager, Company 5707 (2014 to 2019).", "reviewer": "Reviewer 5546, Compliance Analyst (internal)", "reviewed_at": "2026-11-05T10:26", "entities": {"Company 0615": ["named in the call"], "Company 5485": ["listed", "expert's current employer"], "Company 5707": ["expert's former employer (left 2019)"], "Expert 9432": ["the expert"]}, "tid": "0587"}, "false-alarm-expert-0383": {"topic": "Payments lending strategy", "profile": "Expert 0383. Head of Product, Company 9728 (2017 to 2

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI performance benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e9edf2;
--red:#d1342f;--red-wash:#fdeeed;--hi:#b42318;--hi-wash:#fef3f2;--lo:#475569;
--amber:#b7791f;--amber-bar:#c08a2e;--amber-wash:#fdf6e7;--grey-bar:#cbd5e1;
--blue:#2f62c9;--blue-wash:#eef4ff;--violet:#6d4bd1;--violet-wash:#f4f0ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 32px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.badge{font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 10px}
main{max-width:1120px;margin:0 auto;padding:36px 32px 64px}
.view{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:36px;letter-spacing:-.9px;margin:0 0 6px;font-weight:700;line-height:1.15}
.sub1{color:var(--muted);font-size:15px;margin:0 0 22px}
h2{font-size:18px;margin:0 0 6px;font-weight:650}
/* top cards */
.kpis{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:40px}
.kpi{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line)}
.kh{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.risk .tag{color:var(--red);background:var(--red-wash)} .fa .tag{color:var(--amber);background:var(--amber-wash)}
.nums{display:flex;align-items:flex-end;gap:28px;margin:16px 0 14px;flex-wrap:wrap}
.big{font-weight:750;letter-spacing:-2px;line-height:.95;font-variant-numeric:tabular-nums}
.big.base{font-size:34px;color:var(--ink2);letter-spacing:-1px}
.big.miss{font-size:72px;color:var(--red)} .fa .big{font-size:48px;color:var(--amber)}
.lab{color:var(--muted);font-size:13px;margin-top:6px}
.sbar{display:flex;gap:2px;height:14px}
.sbar i,.mini i{display:block;height:100%}
.sbar i:first-child,.mini i:first-child{border-radius:4px 0 0 4px} .sbar i:last-child,.mini i:last-child{border-radius:0 4px 4px 0}
.sbar i:only-child,.mini i:only-child{border-radius:4px}
.sleg{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sleg span{display:inline-flex;align-items:center;gap:6px} .sleg b{color:var(--ink);font-weight:600}
.sleg i{width:9px;height:9px;border-radius:2px;display:inline-block}
/* categories */
.grp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grp i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line);margin-bottom:12px;overflow:hidden}
.cat.hi{box-shadow:inset 4px 0 0 var(--hi),0 0 0 1px var(--line)} .cat.am{box-shadow:inset 4px 0 0 #d9b979,0 0 0 1px var(--line)}
.top{display:grid;grid-template-columns:1fr 200px 72px 18px;gap:16px;align-items:center;padding:18px 22px;width:100%;text-align:left}
.top[role=button]{cursor:pointer} .top[role=button]:hover{background:#fbfbfc}
.n{font-size:18px;font-weight:650;letter-spacing:-.2px} .d{color:var(--muted);font-size:13px}
.c{font-size:28px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.c small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:4px;white-space:nowrap}
.hi .c{color:var(--hi)} .lo .c{color:var(--lo)} .am .c{color:var(--amber)} .c.zero{color:var(--faint)!important}
.mini{display:flex;gap:2px;height:8px}
.tog{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-135deg);margin-top:4px;justify-self:end;transition:transform .2s}
.shut .tog{transform:rotate(45deg);margin-top:-4px} .tog.none{visibility:hidden}
.fasec{margin-top:40px}
.fasec .top{padding:14px 22px} .fasec .n{font-size:15px} .fasec .c{font-size:22px}
/* carousel */
.car{padding:0 22px 18px}
.carhead{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-6px 0 10px;color:var(--faint);font-size:12px}
.arr{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;background:#fff}
.arr:before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2)}
.arr.l:before{transform:rotate(135deg);margin-left:3px} .arr.r:before{transform:rotate(-45deg);margin-right:3px}
.arr:disabled{opacity:.35;cursor:default}
.cards{display:grid;gap:12px}
.cards.moved .ex{animation:in .25s ease-out}
.ex{position:relative;display:flex;flex-direction:column;gap:14px;border-radius:12px;padding:14px 16px;background:var(--bg);min-width:0}
.hi .ex{background:var(--hi-wash)} .am .ex{background:var(--amber-wash)}
a.ex{transition:transform .15s,box-shadow .15s} a.ex:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(15,23,42,.08)}
a.ex:after{content:"";position:absolute;right:16px;bottom:22px;width:7px;height:7px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(-45deg)}
.ex q{color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.ex .cl{font-size:12px;color:var(--amber);font-weight:500}
.who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-right:16px}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--lo)}
.hi .av{background:var(--hi)} .am .av{background:var(--amber)}
.nm{font-weight:600;font-size:13px;line-height:1.2} .dt{color:var(--muted);font-size:12px}
/* transcript */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:18px}
.back:before{content:"";width:7px;height:7px;border-left:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.ctx{display:grid;grid-template-columns:1fr 1fr 2fr;background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);margin:14px 0 16px}
.ctx > div{padding:16px 20px;border-left:1px solid var(--line)} .ctx > div:first-child{border-left:0}
.ctx .wide{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
.k{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.v{color:var(--ink2)} .v b{color:var(--ink)}
.tr{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:12px 24px 18px}
.turn{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:9px 0}
.turn .t{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.turn .s{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:1px}
.turn.q .x{color:var(--muted)}
.hit{border-radius:12px;padding:12px 14px}
.hit.missed{background:var(--red-wash);box-shadow:inset 3px 0 0 var(--red)} .hit.false_alarm{background:var(--amber-wash);box-shadow:inset 3px 0 0 var(--amber-bar)}
.hit .htag{display:inline-block;font-size:12px;font-weight:600;background:#fff;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.hit.missed .htag{color:var(--red)} .hit.false_alarm .htag{color:var(--amber)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.note{border-radius:10px;padding:11px 13px}
.note.rev{background:var(--blue-wash);box-shadow:inset 3px 0 0 var(--blue)} .note.rev .nt{color:var(--blue)}
.note.agent{background:var(--violet-wash);box-shadow:inset 3px 0 0 var(--violet)} .note.agent .nt{color:var(--violet)}
.nt{font-size:13px;font-weight:650} .ns{font-size:12px;color:var(--muted);margin:0 0 6px}
.notfound{padding:40px 0;color:var(--muted)}
/* tablet and phone */
@media (max-width:900px){
  .kpis{grid-template-columns:1fr}
  .top{grid-template-columns:1fr 64px 18px}
  .top .barcell{grid-column:1/-1;order:9}
  .ctx{grid-template-columns:1fr 1fr} .ctx > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  nav{padding:0 16px} main{padding:24px 16px 48px}
  h1{font-size:28px} .big.miss{font-size:56px} .fa .big{font-size:40px}
  .top{padding:14px 16px} .car{padding:0 16px 14px} .tr{padding:8px 16px 14px}
  .notes{grid-template-columns:1fr} .turn{grid-template-columns:40px 1fr;gap:10px}
  .ctx{grid-template-columns:1fr} .ctx > div{border-left:0!important;border-top:1px solid var(--line)} .ctx > div:first-child{border-top:0}
}
</style>
</head>

"kind": "missed", "category": "Personal data", "name": "Sofia Marchetti", "date": "2026-10-31", "ts": "05:48", "quote": "Speak to Mark Doyle in their Leeds office. I've got his personal mobile if you want it.", "source": "written for the design", "cleared": null, "transcript": null}, {"id": "missed-kwame-mensah", "kind": "missed", "category": "Personal data", "name": "Kwame Mensah", "date": "2026-11-03", "ts": "28:33", "quote": "The head of sales there, Aisha Rahman, went on long-term sick leave after surgery in the spring.", "source": "written for the design", "cleared": null, "transcript": null}, {"id": "missed-lena-hoffmann", "kind": "missed", "category": "Personal data", "name": "Lena Hoffmann", "date": "2026-11-08", "ts": "12:19", "quote": "One of their senior engineers, Pieter van Dam, was let go after a drink-driving conviction, which hit the project hard.", "source": "written for the design", "cleared": null, "transcript": null}, {"id": "missed-daniel-osei", "kind": "missed", "category": "Personal data", "name": "Daniel Osei", "date": "2026-11-14", "ts": "20:04", "quote": "Their compliance officer, Rachel Lim, is on maternity leave until next summer, so the team is stretched.", "source": "written for the design", "cleared": null, "transcript": null}, {"id": "missed-aoife-brennan", "kind": "missed", "category": "Personal data", "name": "Aoife Brennan", "date": "2026-11-19", "ts": "33:47", "quote": "The founder's son is only nineteen, and he's been put on the payroll as a director at the Dublin subsidiary.", "source": "written for the design", "cleared": null, "transcript": null}, {"id": "false-alarm-daniel-reyes", "kind": "false_alarm", "category": "Material non-public information", "name": "Daniel Reyes", "date": "2026-11-03", "ts": "01:19", "quote": "Publicly, people talk about the mid-sized regional players. Corvane Freight is the one everyone mentions, they're strong in the North West and Scotland.", "source": "test set T2-01:19", "cleared": "Public speculation about a takeover target, not the expert's employer", "transcript": "false-alarm-daniel-reyes"}, {"id": "false-alarm-tom-fairley", "kind": "false_alarm", "category": "Material non-public information", "name": "Tom Fairley", "date": "2026-11-06", "ts": "00:26", "quote": "Quillon laid out the lending strategy at their 2024 investor day. The logic is straightforward: they already see merchants' transaction data, so they can underwrite small loans with better information than a bank.", "source": "test set T4-00:26", "cleared": "Former employer, left in 2021; cites the public investor day", "transcript": "false-alarm-tom-fairley"}, {"id": "false-alarm-robert-chen", "kind": "false_alarm", "category": "Material non-public information", "name": "Robert Chen", "date": "2026-11-12", "ts": "00:36", "quote": "Ardent is a good one because they're transparent. On their Q2 earnings call in August, they reported gross margin of 31.4%, up from 28.9% a year earlier, and guided to 32% to 33% for the full year.", "source": "test set T7-00:36", "cleared": "Figures from the public Q2 earnings call", "transcript": "false-alarm-robert-chen"}, {"id": "false-alarm-laura-bennett", "kind": "false_alarm", "category": "Material non-public information", "name": "Laura Bennett", "date": "2026-11-14", "ts": "00:51", "quote": "As their annual report says, they've been closing stores in the north for two years, so the shift to online isn't new.", "source": "written for the design", "cleared": "Cites the published annual report", "transcript": "false-alarm-laura-bennett"}, {"id": "false-alarm-arjun-mehra", "kind": "false_alarm", "category": "Material non-public information", "name": "Arjun Mehra", "date": "2026-11-19", "ts": "01:30", "quote": "The chief executive said on the results call that capital spending would rise next year, mostly on automation.", "source": "written for the design", "cleared": "A public statement on the results call", "transcript": "false-alarm-arjun-mehra"}, {"id": "false-alarm-chloe-martin", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Chloe Martin", "date": "2026-10-28", "ts": "01:20", "quote": "We announced the Leeds office in a press release last month, so it's no secret we're expanding in the north.", "source": "written for the design", "cleared": "Announced in a press release", "transcript": "false-alarm-chloe-martin"}, {"id": "false-alarm-ibrahim-yusuf", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Ibrahim Yusuf", "date": "2026-11-04", "ts": "01:56", "quote": "Our prices are on the website. The standard tier is £40 a seat, and that hasn't changed this year.", "source": "written for the design", "cleared": "Published list price", "transcript": "false-alarm-ibrahim-yusuf"}, {"id": "false-alarm-ruth-okonkwo", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Ruth Okonkwo", "date": "2026-11-11", "ts": "00:52", "quote": "I can only tell you what's in our published sustainability report: we cut emissions by about a tenth last year.", "source": "written for the design", "cleared": "From the published sustainability report", "transcript": "false-alarm-ruth-okonkwo"}, {"id": "false-alarm-marco-rossi", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Marco Rossi", "date": "2026-11-17", "ts": "01:22", "quote": "Our chief executive showed the new product on stage at the trade show in September, so it's public now.", "source": "written for the design", "cleared": "Shown publicly at a trade show", "transcript": "false-alarm-marco-rossi"}], "transcripts": {"missed-sanjay-mehta": {"topic": "Medical devices", "profile": "Sanjay Mehta. Finance Director, Northwind Biomedical (2018 to March 2026). Independent consultant (March 2026 to present). Industry: medical devices.", "declaration": "Left Northwind Biomedical (listed company) in March 2026. No current employer in medical devices. Standard confidentiality obligations to Northwind. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Sanjay, thanks for your time. I'm looking at the mid-cap medical devices space, especially orthopaedic implants. How is demand?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Strong. Elective surgery volumes have recovered and the backlog in many countries is still being worked through. Ageing populations make the long-term demand very predictable."}, {"ts": "00:35", "speaker": "INTERVIEWER", "text": "How about pricing?"}, {"ts": "00:38", "speaker": "EXPERT", "text": "Under pressure from hospital procurement, especially in Europe where tenders are aggressive. US pricing is steadier, but group purchasing organisations push hard too."}, {"ts": "01:00", "speaker": "INTERVIEWER", "text": "What about Northwind specifically?"}, {"ts": "01:03", "speaker": "EXPERT", "text": "I'll stay careful there since I only left in March. Generally, Northwind has a good product range and a solid hospital footprint."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "Anything investors should be aware of?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Look, I'm not saying anything specific, but if I were you I'd watch their Q3 numbers closely. Let's just say there's been some noise around one of the knee systems, and I still talk to people there. Quality issues take a while to show up in the numbers."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "Okay. Going back to the market, how important is regulation?"}, {"ts": "01:57", "speaker": "EXPERT", "text": "Very. The EU medical device regulation raised the bar for clinical evidence. Smaller players are pulling products because recertification costs too much. That's good for the bigger, well-capitalised companies."}, {"ts": "02:25", "speaker": "INTERVIEWER", "text": "And robotics in orthopaedics?"}, {"ts": "02:29", "speaker": "EXPERT", "text": "It's the main arms race. Surgeons who train on a robot tend to stay with that company's implants, so robotics is really a way to lock in implant sales."}, {"ts": "02:50", "speaker": "INTERVIEWER", "text": "Thank you, Sanjay."}], "passage_ts": "01:24", "reviewer_comment": "Hedged, but points to a possible undisclosed product quality issue at a listed former employer, sourced from current contacts there. Too uncertain for AI to clear or reject; needs a compliance reviewer.", "root_cause": "The AI looks for named companies, and none is named: the expert says “their”. Linking it to Northwind, a listed company he left in March 2026, needs the question before it and his declaration.", "source": "test set, transcript 5", "id": "missed-sanjay-mehta", "kind": "missed", "category": "Material non-public information", "name": "Sanjay Mehta", "date": "2026-11-12", "role": "Finance Director, Northwind Biomedical (2018 to March 2026). Independent consultant (March 2026 to present)."}, "missed-olivia-grant": {"topic": "Diabetes drug approvals", "profile": "Olivia Grant. Regulatory Affairs Manager, Pellham Biosciences (2016 to 2022). Principal Consultant, Ashgrove Regulatory Partners (2022 to present). Industry: pharmaceuticals, regulatory affairs.", "declaration": "Currently a consultant at Ashgrove Regulatory Partners, which advises listed drug developers on regulatory submissions; Torvane Pharma (listed company) is a current client. Must not discuss any client's non-public regulatory, clinical or commercial information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Thanks for joining, Olivia. I'm looking at diabetes and weight-loss drugs, and how regulators are treating the newer once-weekly treatments. Where are we in the cycle?"}, {"ts": "00:16", "speaker": "EXPERT", "text": "We're in a busy phase. After the first wave of once-weekly injectables, regulators have a clearer template for what they want to see, so submissions are better prepared. The questions have moved on from whether these drugs work to long-term safety, especially heart outcomes and muscle loss."}, {"ts": "00:52", "speaker": "INTERVIEWER", "text": "How long are reviews taking at the moment?"}, {"ts": "00:57", "speaker": "EXPERT", "text": "Standard reviews are running close to the published timelines, roughly a year. Where it slips is when the regulator asks for more data mid-review. That can add six months, and smaller companies often haven't budgeted for it."}, {"ts": "01:31", "speaker": "INTERVIEWER", "text": "What tends to trigger those requests?"}, {"ts": "01:36", "speaker": "EXPERT", "text": "Usually the safety database is too small, or the trial population doesn't match the patients who'll actually get the drug. Manufacturing is the other one. Inspectors find problems at a contract manufacturer and the whole file stalls."}, {"ts": "02:10", "speaker": "INTERVIEWER", "text": "Torvane has its once-weekly diabetes drug under review. How do you rate their chances?"}, {"ts": "02:17", "speaker": "EXPERT", "text": "Between us, the regulator's decision on their diabetes drug came back last week, and it's a rejection. They haven't announced it yet."}, {"ts": "02:34", "speaker": "INTERVIEWER", "text": "Let's go back to the wider market. How are health systems responding to the price of these drugs?"}, {"ts": "02:41", "speaker": "EXPERT", "text": "Cautiously, in most of Europe. Health systems are limiting access to patients with the highest body mass index or existing heart disease, and pushing for deals linked to outcomes. Volumes will grow, but the price per patient will keep falling."}, {"ts": "03:18", "speaker": "INTERVIEWER", "text": "Thanks, Olivia."}], "passage_ts": "02:17", "reviewer_comment": "The expert advises Torvane on its submissions and disclosed an unannounced regulatory rejection, which is plainly material and non-public. We redacted the passage, held the transcript back from the client and referred the expert to the vetting team.", "root_cause": "The AI assessed each expert turn on its own, and this turn names no company: 'their' points back to Torvane in the interviewer's question. Without that link it never matched the passage to the client listed in the declaration, and read 'the regulator's decision' as general regulatory commentary.", "source": "written for the prototype", "id": "missed-olivia-grant", "kind": "missed", "category": "Material non-public information", "name": "Olivia Grant", "date": "2026-10-29", "role": "Regulatory Affairs Manager, Pellham Biosciences (2016 to 2022). Principal Consultant, Ashgrove Regulatory Partners (2022 to present)."}, "missed-henrik-lindqvist": {"topic": "European tyre market", "profile": "Henrik Lindqvist. Plant Manager, Nordvik Rubber (2012 to 2019). Head of Corporate Strategy, Brannholt Automotive (2019 to present). Industry: automotive components and tyres.", "declaration": "Currently employed by Brannholt Automotive (listed company), which owns a European tyre business. May discuss the tyre and components market in general. Must not discuss Brannholt's non-public information, financials, strategy or corporate activity.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Henrik, thanks for your time. I'm researching the European tyre market. How healthy is it right now?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Mixed. Replacement tyres are steady, because people keep driving older cars for longer. Volumes for new cars follow vehicle production, which is still below where it was before the pandemic. And Asian imports have taken a big share of the budget end."}, {"ts": "00:46", "speaker": "INTERVIEWER", "text": "How are European producers responding to the imports?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "By moving up the range. Premium and large-rim tyres, winter and all-season, and tyres designed for electric vehicles, which carry more weight and need to run quietly. The budget segment is very hard to defend with European energy and labour costs."}, {"ts": "01:28", "speaker": "INTERVIEWER", "text": "Is there pressure to consolidate?"}, {"ts": "01:33", "speaker": "EXPERT", "text": "Yes. A lot of diversified component groups are asking whether they should own tyre plants at all. Tyres are capital heavy, and the margins are thinner than in electronics or software-rich parts."}, {"ts": "02:05", "speaker": "INTERVIEWER", "text": "Are any of the groups actually acting on that?"}, {"ts": "02:10", "speaker": "EXPERT", "text": "The board approved the sale of the European tyre business on Tuesday. The announcement is planned for after the half-year results."}, {"ts": "02:28", "speaker": "INTERVIEWER", "text": "Moving on, how much are electric vehicles changing the replacement cycle?"}, {"ts": "02:34", "speaker": "EXPERT", "text": "Quite a lot. Electric cars are heavier and deliver torque instantly, so tyres wear faster, often 20 to 30% sooner. That's good for replacement volumes, and drivers seem willing to pay more for tyres approved for their car."}, {"ts": "03:08", "speaker": "INTERVIEWER", "text": "And raw materials?"}, {"ts": "03:12", "speaker": "EXPERT", "text": "Natural rubber prices have been volatile, and the new European deforestation rules mean producers must trace rubber back to the plantation. That adds cost and favours the bigger groups that already have traceability systems."}], "passage_ts": "02:10", "reviewer_comment": "Henrik heads strategy at Brannholt, a listed company, and disclosed a board-approved sale of its European tyre business ahead of the announcement. We rejected the transcript and escalated the expert for breaching his declaration.", "root_cause": "The expert said 'the board' rather than 'our board' and never named Brannholt, so the AI read the answer as commentary on consolidation among peers. The issue only shows against the declaration, which says he works in strategy at a listed group that owns a European tyre business, and the AI did not make that comparison.", "source": "written for the prototype", "id": "missed-henrik-lindqvist", "kind": "missed", "category": "Material non-public information", "name": "Henrik Lindqvist", "date": "2026-11-05", "role": "Plant Manager, Nordvik Rubber (2012 to 2019). Head of Corporate Strategy, Brannholt Automotive (2019 to present)."}, "missed-nadia-rahimi": {"topic": "Food packaging supply", "profile": "Nadia Rahimi. Account Manager, Fenwick Cartons (2014 to 2018). Key Account Director, Stellan Packaging (2018 to August 2026). Independent packaging consultant (August 2026 to present). Industry: food and drink packaging.", "declaration": "Left Stellan Packaging (listed company) in August 2026. No current employer. Standard confidentiality obligations to Stellan, including its customer contracts. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Nadia, thanks for joining. I'm looking at packaging suppliers to the big food manufacturers. How do those contracts usually work?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Most large food companies run tenders every three to five years for their main packaging categories: cartons, films, trays. The contracts set volumes and a price formula, with pass-through clauses for board, resin and energy costs."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "How sticky are the customers?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "Stickier than people think. Switching means new tooling, line trials and food safety sign-off, which can take most of a year. So incumbents usually keep the business unless service or quality has gone badly wrong."}, {"ts": "01:25", "speaker": "INTERVIEWER", "text": "And how concentrated are the suppliers' customer books?"}, {"ts": "01:30", "speaker": "EXPERT", "text": "Very, for the mid-sized listed players. It's common for the top three customers to be half of revenue. That's fine while things are good, but one lost tender can move the whole year."}, {"ts": "02:02", "speaker": "INTERVIEWER", "text": "Is that a live risk at Stellan?"}, {"ts": "02:07", "speaker": "EXPERT", "text": "Their biggest customer has given notice on the five-year supply deal. That's about a fifth of revenue, and the market doesn't know."}, {"ts": "02:24", "speaker": "INTERVIEWER", "text": "Let's talk about sustainability. How is the plastic packaging tax changing demand?"}, {"ts": "02:30", "speaker": "EXPERT", "text": "It's pushing customers towards recycled content and paper-based formats. Suppliers that secured recycled resin early are winning share, and the others are either paying the tax or losing the work."}, {"ts": "03:02", "speaker": "INTERVIEWER", "text": "What about automation in packaging plants?"}, {"ts": "03:06", "speaker": "EXPERT", "text": "Mostly in quality inspection now. Camera systems catch print and seal defects that people used to miss, and that cuts customer complaints. It's a quick payback, often under two years."}], "passage_ts": "02:07", "reviewer_comment": "The expert left Stellan, a listed company, only in August and disclosed that its largest customer has given notice on a contract worth about a fifth of revenue, which she says the market does not know. We redacted the passage and referred the expert to the vetting team.", "root_cause": "The AI's log scored the turn as a continuation of the expert's general point about customer concentration and labelled it an illustrative industry example. It gave no weight to 'the market doesn't know' and did not check that she had left Stellan, a listed company, three months before the call.", "source": "written for the prototype", "id": "missed-nadia-rahimi", "kind": "missed", "category": "Material non-public information", "name": "Nadia Rahimi", "date": "2026-11-10", "role": "Account Manager, Fenwick Cartons (2014 to 2018). Key Account Director, Stellan Packaging (2018 to August 2026). Independent packaging consultant (August 2026 to present)."}, "missed-benjamin-cole": {"topic": "Industrial pumps distribution", "profile": "Benjamin Cole. Regional Sales Manager, Hartwell Pumps (2014 to 2021). Commercial Director, Ridgeway Industrial Supply (2021 to present). Industry: industrial equipment distribution.", "declaration": "Currently employed by Ridgeway Industrial Supply, the main UK distributor for Corran Engineering (listed company). May discuss the industrial equipment market in general. Must not share Ridgeway's or Corran's non-public sales, order or pricing data.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Benjamin, thanks for joining. I'm looking at demand for industrial pumps and valves in the UK. How does the market feel?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Subdued. Water companies are spending, because the new regulatory period has a big investment programme, but general manufacturing has been cautious all year. Customers are repairing rather than replacing where they can."}, {"ts": "00:45", "speaker": "INTERVIEWER", "text": "How much of the market goes through distributors?"}, {"ts": "00:49", "speaker": "EXPERT", "text": "Most of the smaller orders. Manufacturers sell large engineered pumps direct, but standard units and spares go through distributors, who hold stock and offer next-day delivery. It's really a service business."}, {"ts": "01:22", "speaker": "INTERVIEWER", "text": "What are you seeing on pricing?"}, {"ts": "01:26", "speaker": "EXPERT", "text": "Manufacturers pushed through big increases in 2022 and 2023. This year it's been flat to slightly up. Customers are asking two or three suppliers for quotes before they order."}, {"ts": "01:58", "speaker": "INTERVIEWER", "text": "How do you see Corran heading into the year end?"}, {"ts": "02:03", "speaker": "EXPERT", "text": "I'd expect them to miss guidance. The October order book I saw was down about 15% on last year."}, {"ts": "02:20", "speaker": "INTERVIEWER", "text": "Turning to water, how long will that investment cycle run?"}, {"ts": "02:26", "speaker": "EXPERT", "text": "Five years at least, and the spending is weighted towards the later years. Water companies are under pressure on leaks and sewage overflows, so pumping stations and network upgrades are high on the list. Contractors are more of a bottleneck than equipment."}, {"ts": "03:00", "speaker": "INTERVIEWER", "text": "Any view on energy efficiency rules?"}, {"ts": "03:04", "speaker": "EXPERT", "text": "They help replacement demand. Older motors and pumps can use far more energy than modern variable-speed units, so customers with high power bills can justify a swap on payback alone."}], "passage_ts": "02:03", "reviewer_comment": "As Corran's main distributor, the expert has access to its order data, and he disclosed a non-public order book trend that points to a guidance miss at a listed company. We redacted the passage and reminded the expert of his restrictions.", "root_cause": "The AI logged 'I'd expect them to miss guidance' as the expert's own forecast and classified the passage as opinion. It folded the 15% figure into that view and missed that 'the order book I saw' means he had seen Corran's internal data through the distribution relationship set out in his declaration.", "source": "written for the prototype", "id": "missed-benjamin-cole", "kind": "missed", "category": "Material non-public information", "name": "Benjamin Cole", "date": "2026-11-16", "role": "Regional Sales Manager, Hartwell Pumps (2014 to 2021). Commercial Director, Ridgeway Industrial Supply (2021 to present)."}, "missed-priya-natarajan": {"topic": "Workforce SaaS pricing", "profile": "Priya Natarajan. VP Sales EMEA, Teallight Software (2021 to present). Previously Sales Director, Orbisoft (2016 to 2021). Industry: B2B SaaS, workforce scheduling software.", "declaration": "Currently employed by Teallight Software (private company). May discuss the workforce software market, buyer behaviour and competitors in general terms. Must not share Teallight's non-public pricing, roadmap or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Priya, thanks for joining. I'm looking at the workforce scheduling software market in Europe. How would you describe demand right now?"}, {"ts": "00:14", "speaker": "EXPERT", "text": "Healthy but more scrutinised. Two years ago, buyers were adding tools quickly. Now every purchase goes through finance, and they want a clear payback, usually within a year."}, {"ts": "00:36", "speaker": "INTERVIEWER", "text": "Who are the typical buyers?"}, {"ts": "00:39", "speaker": "EXPERT", "text": "Operations leaders in retail, hospitality and healthcare. HR is involved, but operations owns the budget because scheduling directly drives labour cost, which is often their biggest line."}, {"ts": "01:02", "speaker": "INTERVIEWER", "text": "How competitive is pricing?"}, {"ts": "01:06", "speaker": "EXPERT", "text": "Competitive at the low end, where you have lots of simple tools. At the enterprise end, it's more about integration with payroll and time-and-attendance systems. Switching costs are high once you're integrated."}, {"ts": "01:30", "speaker": "INTERVIEWER", "text": "Are vendors pushing price increases?"}, {"ts": "01:34", "speaker": "EXPERT", "text": "Most of the market is trying. For us specifically, we're moving list price up 12% on the mid-market tier from January. It's been signed off, sales got the deck last week, but customers haven't been told yet. We think churn risk is low because of the integrations."}, {"ts": "02:01", "speaker": "INTERVIEWER", "text": "Interesting. How do buyers usually react to increases like that?"}, {"ts": "02:06", "speaker": "EXPERT", "text": "In general, they push back, then accept if the vendor shows new value at the same time, a new module or better reporting. The ones who churn are usually the smaller accounts who were price shopping anyway."}, {"ts": "02:31", "speaker": "INTERVIEWER", "text": "What about AI features in scheduling?"}, {"ts": "02:35", "speaker": "EXPERT", "text": "Everyone is adding demand forecasting. The useful version predicts footfall or patient volume and builds a draft rota. The hype version is a chatbot on top. Buyers are getting better at telling the difference."}, {"ts": "03:00", "speaker": "INTERVIEWER", "text": "Which segment is growing fastest?"}, {"ts": "03:03", "speaker": "EXPERT", "text": "Healthcare. Staffing pressures are severe, agency costs are high, and better scheduling reduces agency spend directly. That's an easy business case."}, {"ts": "03:25", "speaker": "INTERVIEWER", "text": "Thank you, Priya."}], "passage_ts": "01:34", "reviewer_comment": "Non-public pricing decision at the expert's current employer, not yet told to customers, in breach of her declaration. Redacted; the expert gets a reminder of her restrictions.", "root_cause": "The AI only checks passages that name a company. This one says “for us”, and linking that to Teallight, her current employer, needs her declaration, which the AI didn't read.", "source": "test set, transcript 3", "id": "missed-priya-natarajan", "kind": "missed", "category": "Current-employer confidential", "name": "Priya Natarajan", "date": "2026-11-04", "role": "VP Sales EMEA, Teallight Software (2021 to present). Previously Sales Director, Orbisoft (2016 to 2021)."}, "missed-grace-liu": {"topic": "UK household goods manufacturing", "profile": "Grace Liu. Production Engineer, Thornbury Plastics (2015 to 2020). Operations Director, Kelsall Home Products (2020 to present). Industry: household goods manufacturing.", "declaration": "Currently employed by Kelsall Home Products (private company). May discuss UK manufacturing trends in general. Must not share Kelsall's non-public plans, site decisions, financials or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Grace, thanks for your time. I'm researching UK manufacturers of household goods. What's the biggest pressure on them at the moment?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Energy and labour, in that order. Moulding and finishing use a lot of power, and contracts signed in 2022 and 2023 are only now rolling off. Wages have also risen fast, especially for skilled maintenance engineers."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How are manufacturers responding?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Consolidating sites. A lot of these businesses grew by acquisition and ended up with four or five small plants. Running two bigger, more automated ones is cheaper, even after redundancy and moving costs."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "Is that happening across the sector?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Broadly, yes. Most mid-sized groups have a footprint review going on. The north west has been hit hardest, because many of the older plants are there."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "Are you seeing that in your own business?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "We're closing the Manchester plant in March. The staff haven't been told yet, so please keep that between us."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Understood. Back to the wider market, how do retailers behave as customers?"}, {"ts": "02:18", "speaker": "EXPERT", "text": "They're tough. They want lower prices and smaller, more frequent deliveries. Manufacturers with good forecasting and flexible lines cope. The ones that run long batches end up holding stock."}, {"ts": "02:58", "speaker": "INTERVIEWER", "text": "Where does automation make the most sense?"}, {"ts": "03:02", "speaker": "EXPERT", "text": "Palletising and packing at the end of the line. It's repetitive, it's hard to staff, and the robots are proven. Moulding itself is already fairly automated, so the gains there are smaller."}], "passage_ts": "01:56", "reviewer_comment": "The expert works at Kelsall and disclosed an unannounced plant closure that even the staff have not been told about, which her declaration clearly bars. We redacted the passage and sent her a reminder of her restrictions.", "root_cause": "The AI's log labelled the turn as an example of the sector-wide site consolidation the expert had just described, reading 'we' as the industry. It never resolved 'we' to Kelsall from the declaration, and logged 'keep that between us' as a conversational aside rather than a sign the information is confidential.", "source": "written for the prototype", "id": "missed-grace-liu", "kind": "missed", "category": "Current-employer confidential", "name": "Grace Liu", "date": "2026-10-30", "role": "Production Engineer, Thornbury Plastics (2015 to 2020). Operations Director, Kelsall Home Products (2020 to present)."}, "missed-mateo-alvarez": {"topic": "Retail point-of-sale software", "profile": "Mateo Alvarez. Software Engineer, Plinth Systems (2014 to 2019). Engineering Manager, Quayside Retail Software (2019 to present). Industry: retail point-of-sale and analytics software.", "declaration": "Currently employed by Quayside Retail Software (private company). May discuss the retail software market and hiring trends in general. Must not share Quayside's non-public roadmap, pricing or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Mateo, thanks for joining. I'm looking at point-of-sale software for mid-sized retailers. What are buyers asking for now?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Fewer systems. Retailers used to buy tills, stock control, loyalty and online separately and then pay to connect them. Now they want one platform that sees stock and customers across stores and online."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How hard is it for vendors to deliver that?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Hard. Most vendors started with tills and bolted on the rest. Rebuilding on a single data model is a job of several years, and retailers notice the joins."}, {"ts": "01:18", "speaker": "INTERVIEWER", "text": "What's the hiring market like for engineers in this space?"}, {"ts": "01:22", "speaker": "EXPERT", "text": "Tight for data skills, looser for general web developers. Every vendor wants people who can build reporting and forecasting on top of transaction data. Pay for data engineers has held up even as the wider tech market cooled."}, {"ts": "01:56", "speaker": "INTERVIEWER", "text": "Is Quayside hiring?"}, {"ts": "02:00", "speaker": "EXPERT", "text": "Our roadmap has the analytics module launching in Q2, which is why we've been hiring so many data engineers."}, {"ts": "02:14", "speaker": "INTERVIEWER", "text": "Let's talk about pricing models. How do vendors charge?"}, {"ts": "02:19", "speaker": "EXPERT", "text": "Mostly per store per month, with payment processing on top. Payments is where a lot of the margin comes from, so some vendors discount the software to win the processing."}, {"ts": "02:56", "speaker": "INTERVIEWER", "text": "What makes retailers switch?"}, {"ts": "03:00", "speaker": "EXPERT", "text": "Usually an outage at a busy time, or a new owner who wants one system across the estate. Otherwise switching is painful, so contracts tend to renew."}], "passage_ts": "02:00", "reviewer_comment": "The expert works at Quayside and gave a non-public launch date from its product roadmap, which his declaration bars. We redacted the passage; the general hiring discussion around it was fine.", "root_cause": "The AI's log grouped this turn with the hiring discussion in the previous two turns and classified it as labour market commentary, which the declaration allows. It did not separate out the roadmap launch date attached to the hiring point, which is the confidential part.", "source": "written for the prototype", "id": "missed-mateo-alvarez", "kind": "missed", "category": "Current-employer confidential", "name": "Mateo Alvarez", "date": "2026-11-07", "role": "Software Engineer, Plinth Systems (2014 to 2019). Engineering Manager, Quayside Retail Software (2019 to present)."}, "missed-siobhan-kelly": {"topic": "Outsourced facilities management", "profile": "Siobhan Kelly. Account Manager, Brayfield Telecom (2015 to 2021). Senior Account Director, Calder Facilities Services (2021 to present). Industry: outsourced facilities management.", "declaration": "Currently employed by Calder Facilities Services (private company). May discuss the facilities management market in general. Must not share Calder's non-public customer, contract or financial information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Siobhan, thanks for joining. I'm researching outsourced facilities management in the UK. How is the market doing?"}, {"ts": "00:12", "speaker": "EXPERT", "text": "Growing slowly. Office demand is still lower than before the pandemic, but hospitals, universities and logistics sites have picked up some of the slack. Clients want fewer providers covering more services."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "How long do contracts usually run?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Three to five years for most corporate clients, longer in the public sector. Renewal rates are high in general, because switching providers means transferring staff, and that's a lot of work for the client."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "What makes a client leave?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Service failures that reach senior management, usually cleaning or security. Or a new procurement lead who wants to retender everything to show savings."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "How are things on your side at the moment?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "We're about to lose our second-largest customer. I'm on the account team, and the renewal isn't going to happen."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Moving to costs, how is the National Living Wage affecting margins?"}, {"ts": "02:18", "speaker": "EXPERT", "text": "It's the biggest single issue. Labour is most of the cost base, so every rise has to be passed through ": "EXPERT", "text": "Very. There are a handful of large national players and then thousands of small operators, many of them family businesses with ten or twenty trucks. Driver shortages and fuel costs have pushed a lot of the small ones to the edge, so consolidation has been happening for years."}, {"ts": "00:44", "speaker": "INTERVIEWER", "text": "What's driving deals at the larger end?"}, {"ts": "00:48", "speaker": "EXPERT", "text": "Network density, mainly. If you can fill trucks on the return leg, your economics change completely. And customers increasingly want one provider across the country, not five regional ones."}, {"ts": "01:15", "speaker": "INTERVIEWER", "text": "Are there obvious targets?"}, {"ts": "01:19", "speaker": "EXPERT", "text": "Publicly, people talk about the mid-sized regional players. Corvane Freight is the one everyone mentions, they're strong in the North West and Scotland."}, {"ts": "01:35", "speaker": "INTERVIEWER", "text": "Do you think Corvane stays independent?"}, {"ts": "01:39", "speaker": "EXPERT", "text": "Honestly? I'd be surprised if Corvane is still independent by spring. I probably shouldn't say much more, but we've had integration planning sessions already. They're staffing the integration team from our side, and there's a project codename going around internally. The board's signed off on it, it's just timing on the announcement."}, {"ts": "02:12", "speaker": "INTERVIEWER", "text": "Okay. Let's step back to the broader market. How are fuel costs affecting pricing?"}, {"ts": "02:20", "speaker": "EXPERT", "text": "Fuel surcharges are standard now, so most of the volatility gets passed through. The bigger issue is driver wages. They're up a lot over three years and they don't come back down. Operators who didn't lock in rate increases are hurting."}, {"ts": "02:51", "speaker": "INTERVIEWER", "text": "And electrification?"}, {"ts": "02:55", "speaker": "EXPERT", "text": "Early. Electric vans for last mile, yes. Heavy goods vehicles, still mostly pilots. Charging at depots is the bottleneck, grid connections can take years. Hydrogen gets talked about, but I don't see it at scale this decade."}, {"ts": "03:28", "speaker": "INTERVIEWER", "text": "Where's the margin opportunity for operators?"}, {"ts": "03:32", "speaker": "EXPERT", "text": "Contract logistics rather than spot freight. Multi-year contracts with warehousing attached are stickier and better margin. Spot is a race to the bottom when capacity is loose."}, {"ts": "04:00", "speaker": "INTERVIEWER", "text": "Thanks, Daniel."}], "passage_ts": "01:19", "reviewer_comment": "Naming Corvane as a commonly mentioned target is public speculation, and Corvane isn't the expert's employer. Cleared.", "root_cause": "The AI flags any passage that names a company. It matched “Corvane Freight” and didn't weigh that the expert framed it as public talk.", "source": "test set, transcript 2", "id": "false-alarm-daniel-reyes", "kind": "false_alarm", "category": "Material non-public information", "name": "Daniel Reyes", "date": "2026-11-03", "role": "Regional Operations Manager, Halbrook Logistics (2019 to present). Previously Depot Manager, Marlow Haulage (2014 to 2019)."}, "false-alarm-tom-fairley": {"topic": "Payments lending strategy", "profile": "Tom Fairley. Head of Product, Quillon Payments (2017 to 2021). Chief Product Officer, Brisk Invoicing (2021 to 2024). Independent advisor (2024 to present). Industry: payments and fintech.", "declaration": "Left Quillon Payments in 2021 and Brisk Invoicing in 2024. No current employer. Standard confidentiality obligations to former employers. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Tom, thanks for joining. I'm looking at Quillon's move into small business lending. You were there for four years, so I'd love your view."}, {"ts": "00:13", "speaker": "EXPERT", "text": "Happy to, with the caveat that I left in 2021, so I'll stick to what's public and my general view of the market."}, {"ts": "00:24", "speaker": "INTERVIEWER", "text": "Understood."}, {"ts": "00:26", "speaker": "EXPERT", "text": "Quillon laid out the lending strategy at their 2024 investor day. The logic is straightforward: they already see merchants' transaction data, so they can underwrite small loans with better information than a bank. That's the whole thesis, and it's been in their public filings since."}, {"ts": "00:55", "speaker": "INTERVIEWER", "text": "Does the thesis hold up?"}, {"ts": "00:58", "speaker": "EXPERT", "text": "Mostly. Payment data is a strong signal for cash flow. The risk is concentration. If a sector like hospitality has a bad year, a lot of their borrowers suffer at once. When I was there, the culture was very product-led, and lending is a credit business, so building that muscle takes time."}, {"ts": "01:30", "speaker": "INTERVIEWER", "text": "How do competitors compare?"}, {"ts": "01:33", "speaker": "EXPERT", "text": "Several payment providers are doing the same thing. The differentiator is how quickly they can approve a loan and how well they price risk. Speed sells to small businesses. Pricing determines whether the book makes money."}, {"ts": "02:00", "speaker": "INTERVIEWER", "text": "What should investors watch?"}, {"ts": "02:03", "speaker": "EXPERT", "text": "Default rates by sector and vintage, which Quillon reports in its annual results, and how much of the loan book they keep versus sell on to funding partners. Keeping it boosts revenue but adds risk to the balance sheet."}, {"ts": "02:30", "speaker": "INTERVIEWER", "text": "Any view on management?"}, {"ts": "02:33", "speaker": "EXPERT", "text": "The CEO has been consistent and public about wanting to become a broader financial services provider for small businesses. Whether they execute is the question, but the direction isn't a secret."}, {"ts": "02:52", "speaker": "INTERVIEWER", "text": "Thanks, Tom."}], "passage_ts": "00:26", "reviewer_comment": "The expert left Quillon in 2021 and everything here is from the public investor day and filings. Cleared.", "root_cause": "It matched “Quillon”, the expert's former employer, without checking that he left in 2021 or that he cites the public investor day.", "source": "test set, transcript 4", "id": "false-alarm-tom-fairley", "kind": "false_alarm", "category": "Material non-public information", "name": "Tom Fairley", "date": "2026-11-06", "role": "Head of Product, Quillon Payments (2017 to 2021). Chief Product Officer, Brisk Invoicing (2021 to 2024). Independent advisor (2024 to present)."}, "false-alarm-robert-chen": {"topic": "Packaged food margins", "profile": "Robert Chen. CFO, Ardent Foods (2016 to 2022). Non-executive director at two private food companies (2022 to present). Industry: packaged food manufacturing.", "declaration": "Left Ardent Foods (listed company) in 2022. Non-executive roles at two private food companies, declared by name and excluded from discussion. No conflicts with Ardent declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Robert, thanks for joining. I'm looking at margins in packaged food. Can you walk me through what's happening?"}, {"ts": "00:11", "speaker": "EXPERT", "text": "Margins got squeezed hard in 2022 and 2023 by input costs: wheat, oils, packaging, energy. Since then, most manufacturers have rebuilt them through price increases and mix."}, {"ts": "00:33", "speaker": "INTERVIEWER", "text": "Can you give a concrete example?"}, {"ts": "00:36", "speaker": "EXPERT", "text": "Ardent is a good one because they're transparent. On their Q2 earnings call in August, they reported gross margin of 31.4%, up from 28.9% a year earlier, and guided to 32% to 33% for the full year. They attributed most of it to pricing and to exiting low-margin private label contracts."}, {"ts": "01:08", "speaker": "INTERVIEWER", "text": "That's quite specific. Is that from your time there?"}, {"ts": "01:11", "speaker": "EXPERT", "text": "No, that's all from the August call and the slides they published. I left in 2022. I'm just reading their numbers like any analyst would."}, {"ts": "01:25", "speaker": "INTERVIEWER", "text": "Got it. Is the private label exit a smart move?"}, {"ts": "01:29", "speaker": "EXPERT", "text": "For margins, yes. For volume, it hurts, and it means factories run below capacity unless they fill them with branded growth. That's the trade-off every mid-sized manufacturer faces."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "What about retailer pushback on prices?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "It's intense. Retailers are delisting brands that push too hard, and promoting their own label. The brands with genuine pricing power are the ones consumers will switch stores for, and there aren't many."}, {"ts": "02:20", "speaker": "INTERVIEWER", "text": "What would you watch going forward?"}, {"ts": "02:23", "speaker": "EXPERT", "text": "Volume trends. Margin recovery through price only lasts so long. If volumes keep falling, manufacturers will have to reinvest in promotion, and margins will come back down."}, {"ts": "02:45", "speaker": "INTERVIEWER", "text": "Thanks, Robert."}], "passage_ts": "00:36", "reviewer_comment": "Precise figures, but all from the public Q2 earnings call and slides, which the expert confirms at 01:11. He left Ardent in 2022. Cleared.", "root_cause": "It matched “Ardent” next to precise margin figures and flagged them, without checking the source the expert gave: the public Q2 earnings call.", "source": "test set, transcript 7", "id": "false-alarm-robert-chen", "kind": "false_alarm", "category": "Material non-public information", "name": "Robert Chen", "date": "2026-11-12", "role": "CFO, Ardent Foods (2016 to 2022). Non-executive director at two private food companies (2022 to present)."}, "false-alarm-laura-bennett": {"topic": "UK fashion retail", "profile": "Laura Bennett. Head of Store Operations, Ellery & Pike (2011 to 2018). Independent retail consultant (2018 to present). Industry: UK fashion retail.", "declaration": "Left Ellery & Pike in 2018. No current employer and no links to any listed retailer. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Laura, thanks for joining. I'm looking at mid-market fashion retailers in the UK, especially Hollin Stores. How has the sector changed?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "The store estate has shrunk a lot. Rents came down after the pandemic, but footfall on secondary high streets hasn't come back, so retailers have been cutting weaker stores and putting money into online and a smaller number of bigger shops."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "Is Hollin doing anything different?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "As their annual report says, they've been closing stores in the north for two years, so the shift to online isn't new. They report the closures and the online share every year."}, {"ts": "01:15", "speaker": "INTERVIEWER", "text": "What makes online profitable for a fashion retailer?"}, {"ts": "01:20", "speaker": "EXPERT", "text": "Returns. Fashion returns rates are high, often a third of orders or more, and every return costs money to collect, check and resell. The retailers that charge for returns or steer customers to return in store do much better."}, {"ts": "01:55", "speaker": "INTERVIEWER", "text": "How are they handling stock?"}, {"ts": "02:00", "speaker": "EXPERT", "text": "Better than five years ago. The good ones buy less up front and reorder bestsellers quickly from nearer suppliers, in Turkey or Morocco rather than Asia. It costs more per unit, but there are fewer markdowns."}, {"ts": "02:36", "speaker": "INTERVIEWER", "text": "What would you watch over the next year?"}, {"ts": "02:41", "speaker": "EXPERT", "text": "Full-price sell-through and returns rates. Those tell you more about the health of a fashion business than headline sales."}, {"ts": "03:05", "speaker": "INTERVIEWER", "text": "Thanks, Laura."}], "passage_ts": "00:51", "reviewer_comment": "The store closures are set out in Hollin's published annual report, which the expert cites directly, and she has no connection to the company. Nothing here is non-public, so we cleared it.", "root_cause": "The AI keyed on 'closing stores', which its rules treat as a restructuring signal, and on Hollin being a listed company named in the question. It did not check the attribution at the start of the sentence: the closures are in Hollin's published annual report, and the expert has no link to the company.", "source": "written for the prototype", "id": "false-alarm-laura-bennett", "kind": "false_alarm", "category": "Material non-public information", "name": "Laura Bennett", "date": "2026-11-14", "role": "Head of Store Operations, Ellery & Pike (2011 to 2018). Independent retail consultant (2018 to present)."}, "false-alarm-arjun-mehra": {"topic": "Warehouse automation spending", "profile": "Arjun Mehra. Engineering Manager, Dunmore Logistics (2013 to 2020). Independent warehouse automation consultant (2020 to present). Industry: warehousing and logistics technology.", "declaration": "Left Dunmore Logistics in 2020. No current employer. No connection to Penrose Distribution. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Arjun, thanks for your time. I'm researching warehouse automation spending, particularly at Penrose Distribution. How are operators thinking about automation now?"}, {"ts": "00:14", "speaker": "EXPERT", "text": "More selectively than a few years ago. During the online boom, people bought big systems quickly. Some of those projects struggled, so boards now want proof of payback and a phased roll-out."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "Where is the money going?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "Goods-to-person systems for small items, autonomous mobile robots for moving pallets, and a lot of software. Warehouse management systems that can direct robots and people together are where the real gains are."}, {"ts": "01:26", "speaker": "INTERVIEWER", "text": "And Penrose?"}, {"ts": "01:30", "speaker": "EXPERT", "text": "The chief executive said on the results call that capital spending would rise next year, mostly on automation. That's in the published transcript, and it fits what the rest of the sector is doing."}, {"ts": "01:50", "speaker": "INTERVIEWER", "text": "What are the risks with these projects?"}, {"ts": "01:55", "speaker": "EXPERT", "text": "Integration and peak trading. If a system isn't stable by October, operators fall back on temporary staff for Christmas and the savings slip a year. Suppliers are also stretched, so lead times on some equipment are long."}, {"ts": "02:32", "speaker": "INTERVIEWER", "text": "How do you judge whether a project worked?"}, {"ts": "02:37", "speaker": "EXPERT", "text": "Cost per unit picked and accuracy, measured over a full year, including peak. Labour savings alone can mislead if maintenance and software costs creep up."}, {"ts": "03:08", "speaker": "INTERVIEWER", "text": "Thanks, Arjun."}], "passage_ts": "01:30", "reviewer_comment": "The expert is repeating what the chief executive said on Penrose's public results call, and he has no connection to the company. We checked the published transcript and cleared the passage.", "root_cause": "The AI keyed on the forward-looking statement about next year's capital spending and the mention of the chief executive, and scored it as possible insider guidance. It did not treat 'on the results call' as a public source, even though the expert adds that the comment is in the published transcript.", "source": "written for the prototype", "id": "false-alarm-arjun-mehra", "kind": "false_alarm", "category": "Material non-public information", "name": "Arjun Mehra", "date": "2026-11-19", "role": "Engineering Manager, Dunmore Logistics (2013 to 2020). Independent warehouse automation consultant (2020 to present)."}, "false-alarm-chloe-martin": {"topic": "UK legal services hiring", "profile": "Chloe Martin. Recruitment Consultant, Harrowgate Partners (2014 to 2020). Head of Talent, Fenmore Legal Services (2020 to present). Industry: legal services and professional hiring.", "declaration": "Currently employed by Fenmore Legal Services (private company). May discuss the legal services job market in general. Must not share Fenmore's non-public plans, financials or client information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Chloe, thanks for joining. I'm looking at hiring in UK legal services outside London. What's changed?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "A lot. Hybrid working means firms can hire good people in Leeds, Manchester or Bristol and pay less than London rates, and many lawyers would rather not commute into the City every day."}, {"ts": "00:42", "speaker": "INTERVIEWER", "text": "Which roles are hardest to fill?"}, {"ts": "00:46", "speaker": "EXPERT", "text": "Mid-level associates in property and employment law, and legal technologists. Trainees are easy to find. People with four to seven years' experience are not."}, {"ts": "01:16", "speaker": "INTERVIEWER", "text": "Are firms opening new offices to reach that talent?"}, {"ts": "01:20", "speaker": "EXPERT", "text": "We announced the Leeds office in a press release last month, so it's no secret we're expanding in the north. Plenty of other firms have done the same."}, {"ts": "01:42", "speaker": "INTERVIEWER", "text": "How are salaries moving outside London?"}, {"ts": "01:46", "speaker": "EXPERT", "text": "Up, but the gap with London is still wide. Firms are competing more on flexibility and training than on pay, especially for parents returning to work."}, {"ts": "02:16", "speaker": "INTERVIEWER", "text": "Is technology changing the junior roles?"}, {"ts": "02:20", "speaker": "EXPERT", "text": "Yes. Document review and first drafts are increasingly done with sof  Carbon capture is the big one for cement, but it needs pipelines and storage that don't exist at scale yet."}, {"ts": "01:55", "speaker": "INTERVIEWER", "text": "Are customers paying more for lower-carbon products?"}, {"ts": "01:59", "speaker": "EXPERT", "text": "Some are. Large contractors and public clients increasingly ask for carbon data in tenders. Housebuilders are more driven by price, though that's changing as building rules tighten."}, {"ts": "02:30", "speaker": "INTERVIEWER", "text": "How is carbon pricing affecting the sector?"}, {"ts": "02:35", "speaker": "EXPERT", "text": "It makes the business case for capture and fuel switching much clearer. A carbon levy on imports also matters, because it should stop cheaper, higher-carbon imports undercutting domestic producers."}, {"ts": "03:07", "speaker": "INTERVIEWER", "text": "Thanks, Ruth."}], "passage_ts": "00:52", "reviewer_comment": "The figure comes straight from Marchbank's published sustainability report, which the expert names, and the report confirms an emissions cut of about a tenth. Public information, so we cleared it.", "root_cause": "The AI's log shows it split the sentence at the colon and assessed 'we cut emissions by about a tenth last year' on its own, as a quantified internal metric about the current employer. The attribution to the published sustainability report sat in the first half of the sentence and was lost.", "source": "written for the prototype", "id": "false-alarm-ruth-okonkwo", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Ruth Okonkwo", "date": "2026-11-11", "role": "Environmental Engineer, Ashby Aggregates (2014 to 2021). Head of Sustainability, Marchbank Building Materials (2021 to present)."}, "false-alarm-marco-rossi": {"topic": "Smart kitchen appliances", "profile": "Marco Rossi. Product Designer, Albaro Elettrodomestici (2013 to 2019). Senior Product Manager, Velmora Home Appliances (2019 to present). Industry: domestic appliances.", "declara <script id="calc">
// Pure functions: every number on the page comes from these. Tests import this block.
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function totals(d) {
  let found = 0, missed = 0, falseAlarms = 0, highMissed = 0;
  for (const c of d.categories) {
    found += c.found; missed += c.missed; falseAlarms += c.false_alarms;
    if (c.priority === "high") highMissed += c.missed;
  }
  const caught = found - missed;
  return { sample: d.sample, found, caught, missed, falseAlarms, flags: caught + falseAlarms, highMissed };
}
// one row per category; base is caught (for misses) or confirmed flags (for false alarms), count is the error
function rows(d, kind) {
  return d.categories.map(c => ({ name: c.name, priority: c.priority, description: c.description,
    base: c.found - c.missed, count: kind === "missed" ? c.missed : c.false_alarms }));
}
function barScale(rs) { return Math.max(...rs.map(r => r.base + r.count)); }
function cardsFor(d, kind, category) { return d.cards.filter(x => x.kind === kind && x.category === category); }
function perView(width) { return width < 720 ? 1 : width < 1000 ? 2 : 3; }
function windowOf(n, start, per) {
  const s = Math.max(0, Math.min(start, Math.max(0, n - per)));
  return { start: s, end: Math.min(n, s + per) };
}
function initials(name) { return name.split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase(); }
function niceDate(iso) { const [y, m, dd] = iso.split("-").map(Number); return `${dd} ${MONTHS[m - 1]} ${y}`; }
// consistency checks on the data; returns a list of problems (empty when all is well)
function problems(d) {
  const out = [];
  for (const c of d.categories) {
    for (const kind of ["missed", "false_alarm"]) {
      const n = cardsFor(d, kind, c.name).length, max = kind === "missed" ? c.missed : c.false_alarms;
      if (n > max) out.push(`${c.name}: ${n} ${kind} cards but only ${max}`);
    }
    if (c.missed > c.found) out.push(`${c.name}: more missed than found`);
  }
  for (const card of d.cards) {
    const top = d.top.includes(card.category);
    if (top !== Boolean(card.transcript)) out.push(`${card.name}: clickable must equal top category`);
    if (card.transcript) {
      const t = d.transcripts[card.transcript];
      const turn = t && t.turns.find(x => x.ts === t.passage_ts);
      if (!turn || turn.speaker !== "EXPERT" || !turn.text.includes(card.quote)) out.push(`${card.name}: quote not at the passage`);
      if (t && (t.passage_ts !== card.ts || t.name !== card.name || t.date !== card.date)) out.push(`${card.name}: card and transcript differ`);
    }
  }
  return out;
}
if (typeof module !== "undefined") module.exports = { totals, rows, barScale, cardsFor, perView, windowOf, initials, niceDate, problems };
</script>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const app = document.getElementById("app");
const state = { offset: {}, shut: new Set(), per: perView(window.innerWidth), scroll: 0 };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const KIND = { missed: { label: "missed", word: "Missed", colour: "var(--red)" }, false_alarm: { label: "false alarms", word: "False alarm", colour: "var(--amber-bar)" } };

function card(c, level) {
  const inner = `<q>${esc(c.quote)}</q>${c.cleared ? `<span class="cl">Cleared: ${esc(c.cleared)}</span>` : ""}
    <div class="who"><span class="av" aria-hidden="true">${initials(c.name)}</span><div><div class="nm">${esc(c.name)}</div>
    <div class="dt">${niceDate(c.date)} · ${c.ts}</div></div></div>`;
  return c.transcript ? `<a class="ex" href="#t/${c.transcript}" aria-label="Open transcript: ${esc(c.name)}, ${niceDate(c.date)}">${inner}</a>`
                      : `<div class="ex">${inner}</div>`;
}

function category(r, kind, scale, level) {
  const key = `${kind}|${r.name}`, list = cardsFor(D, kind, r.name), has = list.length > 0, shut = state.shut.has(key);
  const baseWord = kind === "missed" ? "caught" : "confirmed";
  const bar = `<div class="mini" style="width:${((r.base + r.count) / scale * 100).toFixed(1)}%" title="${r.base} ${baseWord}, ${r.count} ${KIND[kind].label}">
    <i style="flex:${r.base};background:var(--grey-bar)"></i>${r.count ? `<i style="flex:${r.count};background:${KIND[kind].colour}"></i>` : ""}</div>`;
  const top = `<div class="top"${has ? ` role="button" tabindex="0" aria-expanded="${!shut}" data-toggle="${esc(key)}"` : ""}>
    <div><div class="n">${esc(r.name)}</div><div class="d">${esc(r.description)}</div></div>
    <div class="barcell">${bar}</div><div class="c${r.count ? "" : " zero"}">${r.count}<small>${KIND[kind].label}</small></div>
    <span class="tog${has ? "" : " none"}" aria-hidden="true"></span></div>`;
  let body = "";
  if (has && !shut) {
    const per = state.per, w = windowOf(list.length, state.offset[key] || 0, per);
    const head = list.length > per ? `<div class="carhead"><span data-range>${w.start + 1}–${w.end} of ${list.length}</span>
      <button class="arr l" data-move="${esc(key)}" data-step="-1" aria-label="Previous examples" ${w.start === 0 ? "disabled" : ""}></button>
      <button class="arr r" data-move="${esc(key)}" data-step="1" aria-label="Next examples" ${w.end >= list.length ? "disabled" : ""}></button></div>` : "";
    body = `<div class="car">${head}<div class="cards" style="grid-template-columns:repeat(${per},minmax(0,1fr))">${list.slice(w.start, w.end).map(c => card(c, level)).join("")}</div></div>`;
  }
  return `<div class="cat ${level}${shut ? " shut" : ""}" data-cat="${esc(key)}">${top}${body}</div>`;
}

function summary() {
  const T = totals(D);
  const miss = rows(D, "missed"), fa = rows(D, "false_alarm"), ms = barScale(miss), fs = barScale(fa);
  const group = (rs, kind, scale, levelFor) => ["high", "lower"].map(p => `<div class="grp"><i style="background:var(--${p === "high" ? "hi" : "lo"})"></i>${p === "high" ? "High priority" : "Medium and low priority"}</div>` +
    rs.filter(r => r.priority === p).map(r => category(r, kind, scale, levelFor(r))).join("")).join("");
  return `<div class="view"><h1>AI performance benchmark</h1>
  <p class="sub1">${T.sample.toLocaleString("en-GB")} transcripts reviewed by the AI and by human reviewers</p>
  <div class="kpis">
    <section class="kpi risk" aria-label="Compliance risks"><div class="kh">Compliance risks <span class="tag">Liability risk</span></div>
      <div class="nums"><div><div class="big base" data-n="found">${T.found}</div><div class="lab">found by human reviewers</div></div>
      <div><div class="big miss" data-n="missed">${T.missed}</div><div class="lab">missed by AI</div></div></div>
      <div class="sbar" role="img" aria-label="${T.caught} caught by AI, ${T.missed} missed by AI"><i style="flex:${T.caught};background:var(--grey-bar)"></i><i style="flex:${T.missed};background:var(--red)"></i></div>
      <div class="sleg"><span><i style="background:var(--grey-bar)"></i>Caught by AI <b data-n="caught">${T.caught}</b></span><span><i style="background:var(--red)"></i>Missed by AI <b>${T.missed}</b></span></div></section>
    <section class="kpi fa" aria-label="False alarms"><div class="kh">False alarms <span class="tag">Operational risk</span></div>
      <div class="nums"><div><div class="big" data-n="false">${T.falseAlarms}</div><div class="lab">flagged by AI, cleared by human reviewers</div></div></div>
      <div class="sbar" role="img" aria-label="${T.caught} confirmed, ${T.falseAlarms} false alarms"><i style="flex:${T.caught};background:var(--grey-bar)"></i><i style="flex:${T.falseAlarms};background:var(--amber-bar)"></i></div>
      <div class="sleg"><span><i style="background:var(--grey-bar)"></i>Confirmed <b>${T.caught}</b></span><span><i style="background:var(--amber-bar)"></i>False alarms <b>${T.falseAlarms}</b></span></div></section>
  </div>
  <h2>Missed by AI, by type</h2>${group(miss, "missed", ms, r => r.priority === "high" ? "hi" : "lo")}
  <div class="fasec"><h2>False alarms, by type</h2>${group(fa, "false_alarm", fs, () => "am")}</div></div>`;
}

function transcript(id) {
  const t = D.transcripts[id];
  if (!t) return `<div class="view"><a class="back" href="#">Benchmark</a><p class="notfound">That transcript isn't in this benchmark.</p></div>`;
  const k = KIND[t.kind];
  const turns = t.turns.map(x => {
    const expert = x.speaker === "EXPERT", hit = x.ts === t.passage_ts;
    const text = hit ? `<div class="hit ${t.kind}" id="passage"><span class="htag">${k.word} · ${esc(t.category)}</span><div>${esc(x.text)}</div>
      <div class="notes"><div class="note rev"><div class="nt">Reviewer's comment</div><div class="ns">Compliance reviewer</div>${esc(t.reviewer_comment)}</div>
      <div class="note agent"><div class="nt">${t.kind === "missed" ? "Why the original AI didn't flag it" : "Why the original AI flagged it"}</div>
      <div class="ns">Analysis by an independent agent, from the original AI's log</div>${esc(t.root_cause)}</div></div></div>` : `<div class="x">${esc(x.text)}</div>`;
    return `<div class="turn${expert ? "" : " q"}"><span class="t">${x.ts}</span><div><div class="s">${expert ? "Expert" : x.speaker === "AI INTERVIEWER" ? "AI interviewer" : "Interviewer"}</div>${text}</div></div>`;
  }).join("");
  return `<div class="view"><a class="back" href="#">Benchmark</a><div class="eyebrow">Call topic</div><h1>${esc(t.topic)}</h1>
    <div class="ctx"><div><div class="k">Expert</div><div class="v"><b>${esc(t.name)}</b></div></div>
    <div><div class="k">Call date</div><div class="v">${niceDate(t.date)}</div></div>
    <div><div class="k">Role</div><div class="v">${esc(t.role)}</div></div>
    <div class="wide"><div class="k">Declared</div><div class="v">${esc(t.declaration)}</div></div></div>
    <div class="tr">${turns}</div></div>`;
}

function render() {
  const m = location.hash.match(/^#t\/(.+)$/);
  app.innerHTML = m ? transcript(decodeURIComponent(m[1])) : summary();
  document.title = m && D.transcripts[m[1]] ? `${D.transcripts[m[1]].topic} · AI performance benchmark` : "AI performance benchmark";
  document.body.dataset.view = m ? "transcript" : "summary";
  document.body.dataset.ready = "1";
}

app.addEventListener("click", e => {
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const key = mv.dataset.move, n = cardsFor(D, key.split("|")[0], key.split("|")[1]).length;
    state.offset[key] = windowOf(n, (state.offset[key] || 0) + Number(mv.dataset.step), state.per).start;
    const cat = mv.closest(".cat"), html = category(rows(D, key.split("|")[0]).find(r => r.name === key.split("|")[1]), key.split("|")[0],
      barScale(rows(D, key.split("|")[0])), cat.classList.contains("hi") ? "hi" : cat.classList.contains("lo") ? "lo" : "am");
    cat.outerHTML = html;
    const fresh = app.querySelector(`[data-cat="${CSS.escape(key)}"]`);
    fresh.querySelector(".cards").classList.add("moved");
    fresh.querySelector(`[data-move][data-step="${mv.dataset.step}"]:not(:disabled)`)?.focus();
    return;
  }
  const tg = e.target.closest("[data-toggle]");
  if (tg) toggle(tg.dataset.toggle);
});
app.addEventListener("keydown", e => {
  const tg = e.target.closest("[data-toggle]");
  if (tg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tg.dataset.toggle); }
});
function toggle(key) {
  state.shut.has(key) ? state.shut.delete(key) : state.shut.add(key);
  const [kind, name] = key.split("|"), cat = app.querySelector(`[data-cat="${CSS.escape(key)}"]`);
  cat.outerHTML = category(rows(D, kind).find(r => r.name === name), kind, barScale(rows(D, kind)),
    cat.classList.contains("hi") ? "hi" : cat.classList.contains("lo") ? "lo" : "am");
  app.querySelector(`[data-cat="${CSS.escape(key)}"] [data-toggle]`).focus();
}
window.addEventListener("hashchange", () => {
  const toTranscript = location.hash.startsWith("#t/");
  if (toTranscript && document.body.dataset.view === "summary") state.scroll = window.scrollY;
  render();
  window.scrollTo(0, toTranscript ? 0 : state.scroll);
});
window.addEventListener("resize", () => {
  const per = perView(window.innerWidth);
  if (per !== state.per) { state.per = per; if (document.body.dataset.view === "summary") render(); }
});
render();
</script>
</body>
</html>

021). Chief Product Officer, Company 2206 (2021 to 2024). Independent advisor (2024 to present). Industry: payments and fintech.", "declaration": "Left Company 9728 in 2021 and Company 2206 in 2024. No current employer. Standard confidentiality obligations to former employers. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 0383, thanks for joining. I'm looking at Company 9728's move into small business lending. You were there for four years, so I'd love your view."}, {"ts": "00:13", "speaker": "EXPERT", "text": "Happy to, with the caveat that I left in 2021, so I'll stick to what's public and my general view of the market."}, {"ts": "00:24", "speaker": "INTERVIEWER", "text": "Understood."}, {"ts": "00:26", "speaker": "EXPERT", "text": "Company 9728 laid out the lending strategy at their 2024 investor day. The logic is straightforward: they already see merchants' transaction data, so they can decide whether to lend to small businesses with better information than a bank. That's the whole thesis, and it's been in their public filings since."}, {"ts": "00:55", "speaker": "INTERVIEWER", "text": "Does the thesis hold up?"}, {"ts": "00:58", "speaker": "EXPERT", "text": "Mostly. Payment data is a strong signal for cash flow. The risk is concentration. If a sector like hospitality has a bad year, a lot of their borrowers suffer at once. When I was there, the culture was very product-led, and lending is a credit business, so building that muscle takes time."}, {"ts": "01:30", "speaker": "INTERVIEWER", "text": "How do competitors compare?"}, {"ts": "01:33", "speaker": "EXPERT", "text": "Several payment providers are doing the same thing. The differentiator is how quickly they can approve a loan and how well they price risk. Speed sells to small businesses. Pricing determines whether the book makes money."}, {"ts": "02:00", "speaker": "INTERVIEWER", "text": "What should investors watch?"}, {"ts": "02:03", "speaker": "EXPERT", "text": "Default rates by sector and vintage, which Company 9728 reports in its annual results, and how much of the loan book they keep versus sell on to funding partners. Keeping it boosts revenue but adds risk to the balance sheet."}, {"ts": "02:30", "speaker": "INTERVIEWER", "text": "Any view on management?"}, {"ts": "02:33", "speaker": "EXPERT", "text": "The CEO has been consistent and public about wanting to become a broader financial services provider for small businesses. Whether they execute is the question, but the direction isn't a secret."}, {"ts": "02:52", "speaker": "INTERVIEWER", "text": "Thanks, Expert 0383."}], "passage_ts": "00:26", "reviewer_comment": "The expert left Company 9728 in 2021. Everything he says comes from its public investor day and filings. Cleared.", "root_cause": "The AI matched “Company 9728”, the expert's former employer. It did not check that he left in 2021, or that he cites the public investor day.", "source": "test set, transcript 4", "id": "false-alarm-expert-0383", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 0383", "date": "2026-11-06", "role": "Head of Product, Company 9728 (2017 to 2021). Chief Product Officer, Company 2206 (2021 to 2024). Independent advisor (2024 to present).", "reviewer": "Reviewer 8404, Compliance Analyst (internal)", "reviewed_at": "2026-11-07T12:51", "entities": {"Company 2206": ["expert's former employer (left 2024)"], "Company 9728": ["expert's former employer (left 2021)"], "Expert 0383": ["the expert"]}, "tid": "0328"}, "false-alarm-expert-8996": {"topic": "Packaged food margins", "profile": "Expert 8996. CFO, Company 9910 (2016 to 2022). Non-executive director at two private food companies (2022 to present). Industry: packaged food manufacturing.", "declaration": "Left Company 9910 (listed company) in 2022. Non-executive roles at two private food companies, declared by name and excluded from discussion. No conflicts with Company 9910 declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 8996, thanks for joining. I'm looking at margins in packaged food. Can you walk me through what's happening?"}, {"ts": "00:11", "speaker": "EXPERT", "text": "Margins got squeezed hard in 2022 and 2023 by input costs: wheat, oils, packaging, energy. Since then, most manufacturers have rebuilt them through price increases and mix."}, {"ts": "00:33", "speaker": "INTERVIEWER", "text": "Can you give a concrete example?"}, {"ts": "00:36", "speaker": "EXPERT", "text": "Company 9910 is a good one because they're transparent. On their Q2 earnings call in August, they reported gross margin of 31.4%, up from 28.9% a year earlier, and forecast 32% to 33% for the full year. They attributed most of it to pricing and to exiting low-margin private label contracts."}, {"ts": "01:08", "speaker": "INTERVIEWER", "text": "That's quite specific. Is that from your time there?"}, {"ts": "01:11", "speaker": "EXPERT", "text": "No, that's all from the August call and the slides they published. I left in 2022. I'm just reading their numbers like any analyst would."}, {"ts": "01:25", "speaker": "INTERVIEWER", "text": "Got it. Is the private label exit a smart move?"}, {"ts": "01:29", "speaker": "EXPERT", "text": "For margins, yes. For volume, it hurts, and it means factories run below capacity unless they fill them with branded growth. That's the trade-off every mid-sized manufacturer faces."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "What about retailer pushback on prices?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "It's intense. Retailers are delisting brands that push too hard, and promoting their own label. The brands with genuine pricing power are the ones consumers will switch stores for, and there aren't many."}, {"ts": "02:20", "speaker": "INTERVIEWER", "text": "What would you watch going forward?"}, {"ts": "02:23", "speaker": "EXPERT", "text": "Volume trends. Margin recovery through price only lasts so long. If volumes keep falling, manufacturers will have to reinvest in promotion, and margins will come back down."}, {"ts": "02:45", "speaker": "INTERVIEWER", "text": "Thanks, Expert 8996."}], "passage_ts": "00:36", "reviewer_comment": "The figures are precise but come from the public Q2 earnings call and slides, as the expert confirms at 01:11. He left Company 9910 in 2022. Cleared.", "root_cause": "The AI flagged precise margin figures next to “Company 9910” without checking the source the expert gave: the public Q2 earnings call. It should check figures like these against approved public sources, such as company filings and earnings call transcripts, and clear them when they match.", "source": "test set, transcript 7", "id": "false-alarm-expert-8996", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 8996", "date": "2026-11-12", "role": "CFO, Company 9910 (2016 to 2022). Non-executive director at two private food companies (2022 to present).", "reviewer": "Reviewer 8705, Compliance Analyst (internal)", "reviewed_at": "2026-11-14T15:09", "entities": {"Company 9910": ["listed", "expert's former employer (left 2022)"], "Expert 8996": ["the expert"]}, "tid": "0803"}, "false-alarm-expert-3985": {"topic": "UK fashion retail", "profile": "Expert 3985. Head of Store Operations, Company 8528 (2011 to 2018). Independent retail consultant (2018 to present). Industry: UK fashion retail.", "declaration": "Left Company 8528 in 2018. No current employer and no links to any listed retailer. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 3985, thanks for joining. I'm looking at mid-market fashion retailers in the UK, especially Company 8334. How has the sector changed?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "The store estate has shrunk a lot. Rents came down after the pandemic, but footfall on secondary high streets hasn't come back, so retailers have been cutting weaker stores and putting money into online and a smaller number of bigger shops."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "Is Company 8334 doing anything different?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "As their annual report says, they've been closing stores in the north for two years, so the shift to online isn't new. They report the closures and the online share every year."}, {"ts": "01:15", "speaker": "INTERVIEWER", "text": "What makes online profitable for a fashion retailer?"}, {"ts": "01:20", "speaker": "EXPERT", "text": "Returns. Fashion returns rates are high, often a third of orders or more, and every return costs money to collect, check and resell. The retailers that charge for returns or steer customers to return in store do much better."}, {"ts": "01:55", "speaker": "INTERVIEWER", "text": "How are they handling stock?"}, {"ts": "02:00", "speaker": "EXPERT", "text": "Better than five years ago. The good ones buy less up front and reorder bestsellers quickly from nearer suppliers, in Turkey or Morocco rather than Asia. It costs more per unit, but there are fewer markdowns."}, {"ts": "02:36", "speaker": "INTERVIEWER", "text": "What would you watch over the next year?"}, {"ts": "02:41", "speaker": "EXPERT", "text": "Full-price sell-through and returns rates. Those tell you more about the health of a fashion business than headline sales."}, {"ts": "03:05", "speaker": "INTERVIEWER", "text": "Thanks, Expert 3985."}], "passage_ts": "00:51", "reviewer_comment": "The store closures are set out in Company 8334's published annual report, which the expert cites. She has no connection to the company. Nothing here is non-public. Cleared.", "root_cause": "The AI's rules treat “closing stores” as a sign of restructuring, and Company 8334 is a listed company named in the question. The AI did not read the start of the sentence, which attributes the closures to the published annual report.", "source": "written for the prototype", "id": "false-alarm-expert-3985", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 3985", "date": "2026-11-14", "role": "Head of Store Operations, Company 8528 (2011 to 2018). Independent retail consultant (2018 to present).", "reviewer": "Reviewer 5546, Compliance Analyst (internal)", "reviewed_at": "2026-11-15T09:42", "entities": {"Company 8334": ["named in the call"], "Company 8528": ["expert's former employer (left 2018)"], "Expert 3985": ["the expert"]}, "tid": "0106"}, "false-alarm-expert-2518": {"topic": "Warehouse automation spending", "profile": "Expert 2518. Engineering Manager, Company 1047 (2013 to 2020). Independent warehouse automation consultant (2020 to present). Industry: warehousing and logistics technology.", "declaration": "Left Company 1047 in 2020. No current employer. No connection to Company 2306. No conflicts declared.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 2518, thanks for your time. I'm researching warehouse automation spending, particularly at Company 2306. How are operators thinking about automation now?"}, {"ts": "00:14", "speaker": "EXPERT", "text": "More selectively than a few years ago. During the online boom, people bought big systems quickly. Some of those projects struggled, so boards now want proof of payback and a phased roll-out."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "Where is the money going?"}, {"ts": "00:51", "speaker": "EXPERT", "text": "Goods-to-person systems for small items, autonomous mobile robots for moving pallets, and a lot of software. Warehouse management systems that can direct robots and people together are where the real gains are."}, {"ts": "01:26", "speaker": "INTERVIEWER", "text": "And Company 2306?"}, {"ts": "01:30", "speaker": "EXPERT", "text": "The chief executive said on the results call that capital spending would rise next year, mostly on automation. That's in the published transcript, and it fits what the rest of the sector is doing."}, {"ts": "01:50", "speaker": "INTERVIEWER", "text": "What are the risks with these projects?"}, {"ts": "01:55", "speaker": "EXPERT", "text": "Integration and peak trading. If a system isn't stable by October, operators fall back on temporary staff for Christmas and the savings slip a year. Suppliers are also stretched, so lead times on some equipment are long."}, {"ts": "02:32", "speaker": "INTERVIEWER", "text": "How do you judge whether a project worked?"}, {"ts": "02:37", "speaker": "EXPERT", "text": "Cost per unit picked and accuracy, measured over a full year, including peak. Labour savings alone can mislead if maintenance and software costs creep up."}, {"ts": "03:08", "speaker": "INTERVIEWER", "text": "Thanks, Expert 2518."}], "passage_ts": "01:30", "reviewer_comment": "The expert repeats what the chief executive said on Company 2306's public results call. He has no connection to the company. We checked the published transcript of the call. Cleared.", "root_cause": "The AI read the statement about next year's capital spending, and the reference to the chief executive, as possible inside information about the company's plans. It did not treat “on the results call” as a public source, although the expert adds that the comment is in the published transcript.", "source": "written for the prototype", "id": "false-alarm-expert-2518", "kind": "false_alarm", "category": "Material non-public information", "name": "Expert 2518", "date": "2026-11-19", "role": "Engineering Manager, Company 1047 (2013 to 2020). Independent warehouse automation consultant (2020 to present).", "reviewer": "Reviewer 8404, Compliance Analyst (internal)", "reviewed_at": "2026-11-21T11:17", "entities": {"Company 1047": ["expert's former employer (left 2020)"], "Company 2306": ["named in the call"], "Expert 2518": ["the expert"]}, "tid": "0881"}, "false-alarm-expert-8418": {"topic": "UK legal services hiring", "profile": "Expert 8418. Recruitment Consultant, Company 6379 (2014 to 2020). Head of Talent, Company 6339 (2020 to present). Industry: legal services and professional hiring.", "declaration": "Currently employed by Company 6339 (private company). May discuss the legal services job market in general. Must not share Company 6339's non-public plans, financials or client information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 8418, thanks for joining. I'm looking at hiring in UK legal services outside London. What's changed?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "A lot. Hybrid working means firms can hire good people in Leeds, Manchester or Bristol and pay less than London rates, and many lawyers would rather not commute into the City every day."}, {"ts": "00:42", "speaker": "INTERVIEWER", "text": "Which roles are hardest to fill?"}, {"ts": "00:46", "speaker": "EXPERT", "text": "Mid-level associates in property and employment law, and legal technologists. Trainees are easy to find. People with four to seven years' experience are not."}, {"ts": "01:16", "speaker": "INTERVIEWER", "text": "Are firms opening new offices to reach that talent?"}, {"ts": "01:20", "speaker": "EXPERT", "text": "We announced the Leeds office in a press release last month, so it's no secret we're expanding in the north. Plenty of other firms have done the same."}, {"ts": "01:42", "speaker": "INTERVIEWER", "text": "How are salaries moving outside London?"}, {"ts": "01:46", "speaker": "EXPERT", "text": "Up, but the gap with London is still wide. Firms are competing more on flexibility and training than on pay, especially for parents returning to work."}, {"ts": "02:16", "speaker": "INTERVIEWER", "text": "Is technology changing the junior roles?"}, {"ts": "02:20", "speaker": "EXPERT", "text": "Yes. Document review and first drafts are increasingly done with software, so trainees do client work earlier. Firms are rethinking how they train people when the routine tasks are gone."}, {"ts": "02:58", "speaker": "INTERVIEWER", "text": "What would you tell a firm planning to expand in the north?"}, {"ts": "03:02", "speaker": "EXPERT", "text": "Hire a respected local partner first. Lawyers follow people, not brands, and a known name brings a team and clients with them."}], "passage_ts": "01:20", "reviewer_comment": "Company 6339 announced the Leeds office in a press release in September, which we confirmed on its website. The expert is repeating public news about her employer. Cleared.", "root_cause": "The AI matched “we” and a new office to the declaration's ban on Company 6339's non-public plans. It did not check the press release the expert cites, published the month before the call.", "source": "written for the prototype", "id": "false-alarm-expert-8418", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 8418", "date": "2026-10-28", "role": "Recruitment Consultant, Company 6379 (2014 to 2020). Head of Talent, Company 6339 (2020 to present).", "reviewer": "Reviewer 8705, Compliance Analyst (internal)", "reviewed_at": "2026-10-29T14:05", "entities": {"Company 6339": ["private", "expert's current employer"], "Company 6379": ["expert's former employer (left 2020)"], "Expert 8418": ["the expert"]}, "tid": "0570"}, "false-alarm-expert-1578": {"topic": "Field service software", "profile": "Expert 1578. Implementation Consultant, Company 5782 (2015 to 2019). Head of Customer Success, Company 7177 (2019 to present). Industry: B2B SaaS, field service management.", "declaration": "Currently employed by Company 7177 (private company). May discuss the field service software market in general. Must not share Company 7177's non-public pricing, roadmap or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 1578, thanks for joining. I'm looking at software for field service teams: plumbers, electricians, maintenance firms. Who's buying?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Mostly firms with ten to two hundred engineers. Below that, people get by with spreadsheets and a shared calendar. Above that, they tend to buy enterprise systems with long implementations."}, {"ts": "00:42", "speaker": "INTERVIEWER", "text": "What drives the purchase?"}, {"ts": "00:46", "speaker": "EXPERT", "text": "Scheduling and getting paid. If engineers can see their jobs on a phone, take photos and collect payment on site, the office spends less time chasing invoices. That's the business case most owners understand."}, {"ts": "01:20", "speaker": "INTERVIEWER", "text": "How do vendors price these tools?"}, {"ts": "01:24", "speaker": "EXPERT", "text": "Mostly per user per month, with a basic, standard and premium tier. Add-ons like payments or route planning are where vendors try to grow revenue."}, {"ts": "01:52", "speaker": "INTERVIEWER", "text": "Where does Company 7177 sit on price?"}, {"ts": "01:56", "speaker": "EXPERT", "text": "Our prices are on the website. The standard tier is £40 per user, and that hasn't changed this year."}, {"ts": "02:10", "speaker": "INTERVIEWER", "text": "How sticky are customers once they're on a system?"}, {"ts": "02:15", "speaker": "EXPERT", "text": "Fairly sticky. Once job history and customer records are in, moving is painful. Churn is mostly very small firms that close or shrink, not customers leaving for a competitor."}, {"ts": "02:56", "speaker": "INTERVIEWER", "text": "What's the next big feature?"}, {"ts": "03:00", "speaker": "EXPERT", "text": "Smarter scheduling that accounts for traffic, engineer skills and the parts on the van. Most firms still plan the day by hand each morning."}], "passage_ts": "01:56", "reviewer_comment": "The £40 standard tier is on Company 7177's public pricing page, which we checked. A published list price is not confidential. Cleared.", "root_cause": "The AI matched a precise price at the expert's current employer to the declaration's ban on non-public pricing. It did not treat “Our prices are on the website” as a source to check, so it could not tell a published price from internal pricing.", "source": "written for the prototype", "id": "false-alarm-expert-1578", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 1578", "date": "2026-11-04", "role": "Implementation Consultant, Company 5782 (2015 to 2019). Head of Customer Success, Company 7177 (2019 to present).", "reviewer": "Reviewer 5546, Compliance Analyst (internal)", "reviewed_at": "2026-11-06T16:38", "entities": {"Company 5782": ["expert's former employer (left 2019)"], "Company 7177": ["private", "expert's current employer"], "Expert 1578": ["the expert"]}, "tid": "0525"}, "false-alarm-expert-8173": {"topic": "Construction materials decarbonisation", "profile": "Expert 8173. Environmental Engineer, Company 1733 (2014 to 2021). Head of Sustainability, Company 9296 (2021 to present). Industry: construction materials.", "declaration": "Currently employed by Company 9296 (private company). May discuss decarbonisation in the building materials sector in general. Must not share Company 9296's non-public data, plans or customer information.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 8173, thanks for your time. I'm looking at how building materials producers are cutting emissions. Where does the industry stand?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "Early, but moving. Cement and lime are the hard part, because most of the emissions come from the chemistry, not just the fuel. Bricks, blocks and aggregates are easier: it's mostly a question of energy and transport."}, {"ts": "00:47", "speaker": "INTERVIEWER", "text": "Can you share anything on your own company's progress?"}, {"ts": "00:52", "speaker": "EXPERT", "text": "I can only tell you what's in our published sustainability report: we cut emissions by about a tenth last year. Most of that came from switching kilns to lower-carbon fuels, which the report also describes."}, {"ts": "01:16", "speaker": "INTERVIEWER", "text": "What are the main levers for the sector?"}, {"ts": "01:20", "speaker": "EXPERT", "text": "Alternative fuels in kilns, cement blends with less clinker, and electric plant and vehicles at quarries. Carbon capture is the big one for cement, but it needs pipelines and storage that don't exist at scale yet."}, {"ts": "01:55", "speaker": "INTERVIEWER", "text": "Are customers paying more for lower-carbon products?"}, {"ts": "01:59", "speaker": "EXPERT", "text": "Some are. Large contractors and public clients increasingly ask for carbon data in tenders. Housebuilders are more driven by price, though that's changing as building rules tighten."}, {"ts": "02:30", "speaker": "INTERVIEWER", "text": "How is carbon pricing affecting the sector?"}, {"ts": "02:35", "speaker": "EXPERT", "text": "It makes the business case for capture and fuel switching much clearer. A carbon levy on imports also matters, because it should stop cheaper, higher-carbon imports undercutting domestic producers."}, {"ts": "03:07", "speaker": "INTERVIEWER", "text": "Thanks, Expert 8173."}], "passage_ts": "00:52", "reviewer_comment": "The figure is in Company 9296's published sustainability report, which the expert names. The report confirms emissions fell by about a tenth. Public information. Cleared.", "root_cause": "The AI split the sentence at the colon and assessed “we cut emissions by about a tenth last year” on its own, as an internal figure about the current employer. The reference to the published report was in the first half of the sentence, and the AI lost it.", "source": "written for the prototype", "id": "false-alarm-expert-8173", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 8173", "date": "2026-11-11", "role": "Environmental Engineer, Company 1733 (2014 to 2021). Head of Sustainability, Company 9296 (2021 to present).", "reviewer": "Reviewer 8404, Compliance Analyst (internal)", "reviewed_at": "2026-11-12T10:26", "entities": {"Company 1733": ["expert's former employer (left 2021)"], "Company 9296": ["private", "expert's current employer"], "Expert 8173": ["the expert"]}, "tid": "0637"}, "false-alarm-expert-0462": {"topic": "Smart kitchen appliances", "profile": "Expert 0462. Product Designer, Company 0663 (2013 to 2019). Senior Product Manager, Company 4939 (2019 to present). Industry: domestic appliances.", "declaration": "Currently employed by Company 4939 (private company). May discuss the domestic appliance market in general. Must not share Company 4939's non-public product plans, pricing or sales data.", "turns": [{"ts": "00:00", "speaker": "INTERVIEWER", "text": "Expert 0462, thanks for joining. I'm researching connected kitchen appliances in Europe. Is there real demand?"}, {"ts": "00:13", "speaker": "EXPERT", "text": "For some products, yes. Ovens with cameras and guided cooking sell well at the premium end. Connected fridges, much less so. Most buyers don't see the point of a screen on the fridge door."}, {"ts": "00:45", "speaker": "INTERVIEWER", "text": "What do consumers actually value?"}, {"ts": "00:49", "speaker": "EXPERT", "text": "Saving time and energy. Preheating remotely, alerts when a cycle finishes, and seeing energy use. Recipes and apps matter less than the industry hoped."}, {"ts": "01:18", "speaker": "INTERVIEWER", "text": "Is Company 4939 doing anything in this area?"}, {"ts": "01:22", "speaker": "EXPERT", "text": "Our chief executive showed the new product on stage at the trade show in September, so it's public now. It's the connected oven from the press coverage, and I'll stick to what was shown there."}, {"ts": "01:44", "speaker": "INTERVIEWER", "text": "How are retailers selling these products?"}, {"ts": "01:48", "speaker": "EXPERT", "text": "Mostly through kitchen showrooms and big electrical retailers. Demonstrations matter, because people need to see the camera and app working before they pay a premium."}, {"ts": "02:18", "speaker": "INTERVIEWER", "text": "What about price pressure from Asian brands?"}, {"ts": "02:22", "speaker": "EXPERT", "text": "It's strong in the mid-market. European brands are holding on through design, service networks and longer warranties, but the gap on features has closed."}, {"ts": "02:58", "speaker": "INTERVIEWER", "text": "Where do you see the market in five years?"}, {"ts": "03:02", "speaker": "EXPERT", "text": "Connectivity will be standard and nobody will pay extra for it. The value will move to energy management, especially as more homes get solar panels and time-of-use tariffs."}], "passage_ts": "01:22", "reviewer_comment": "The oven was launched on stage at a public trade show in September and reported in the trade press. The expert kept to what was shown there. Cleared.", "root_cause": "The AI matched “new product” to the declaration's ban on non-public product plans, and read “so it's public now” as the expert justifying a disclosure, which its rules treat as higher risk. It did not check the September trade show.", "source": "written for the prototype", "id": "false-alarm-expert-0462", "kind": "false_alarm", "category": "Current-employer confidential", "name": "Expert 0462", "date": "2026-11-17", "role": "Product Designer, Company 0663 (2013 to 2019). Senior Product Manager, Company 4939 (2019 to present).", "reviewer": "Reviewer 8705, Compliance Analyst (internal)", "reviewed_at": "2026-11-19T12:51", "entities": {"Company 0663": ["expert's former employer (left 2019)"], "Company 4939": ["private", "expert's current employer"], "Expert 0462": ["the expert"]}, "tid": "0515"}}, "release": {"note": "Version outputs are SIMULATED, item by item, on the 1,000 reviewed transcripts. The scoring runs on the page.", "baseline": "v1.0", "transcripts": 1000, "high": ["MNPI", "Current employer confidential", "Declaration conflict"], "types": [{"id": "MNPI", "label": "Material non-public information", "priority": "high"}, {"id": "Current employer confidential", "label": "Current-employer confidential", "priority": "high"}, {"id": "Declaration conflict", "label": "Declaration conflict", "priority function niceDate(iso) { const [y, m, dd] = iso.split("-").map(Number); return `${dd} ${MONTHS[m - 1]} ${y}`; }
function niceDateTime(iso) { const [d, t] = iso.split("T"); return `${niceDate(d)}, ${t}`; }
// consistency checks on the data; returns a list of problems (empty when all is well)
function problems(d) {
  const out = [];
  for (const c of d.categories) {
    for (const kind of ["missed", "false_alarm"]) {
      const n = cardsFor(d, kind, c.name).length, max = kind === "missed" ? c.missed : c.false_alarms;
      if (n > max) out.push(`${c.name}: ${n} ${kind} cards but only ${max}`);
    }
    if (c.missed > c.found) out.push(`${c.name}: more missed than found`);
  }
  const faSum = d.false_alarm_types.reduce((s, x) => s + x.count, 0);
  if (faSum !== totals(d).falseAlarms) out.push(`false alarm types sum to ${faSum}, not ${totals(d).falseAlarms}`);
  for (const ty of d.false_alarm_types) if (faTypeCards(d, ty.id).length > ty.count) out.push(`${ty.name}: more cards than false alarms`);
  for (const f of d.fixes) for (const x of f.examples) if (!x.transcript) out.push(`${x.name}: fix example has no transcript`);
  for (const card of d.cards) {
    if (d.top.includes(card.category) && !card.transcript) out.push(`${card.name}: top-category cards must open a transcript`);
    if (card.transcript) {
      const t = d.transcripts[card.transcript];
      const turn = t && t.turns.find(x => x.ts === t.passage_ts);
      if (!turn || turn.speaker !== "EXPERT" || !turn.text.includes(card.quote)) out.push(`${card.name}: quote not at the passage`);
      if (t && (t.passage_ts !== card.ts || t.name !== card.name || t.date !== card.date)) out.push(`${card.name}: card and transcript differ`);
    }
  }
  return out;
}
// expected impact of each fix: misses are counted exactly (one card per miss); false alarms are estimated per category
// as (tagged cards / cards) x that category's false alarms, only where the category has false-alarm cards
function fixImpact(d) {
  return d.fixes.map(f => {
    const missedCards = d.cards.filter(c => c.kind === "missed" && c.fix === f.id);
    let fa = 0, estimated = false;
    for (const c of d.categories) {
      const cards = cardsFor(d, "false_alarm", c.name);
      if (!cards.length) continue;
      const tagged = cards.filter(x => x.fix === f.id).length;
      if (tagged) { fa += Math.round(c.false_alarms * tagged / cards.length); estimated = true; }
    }
    return { id: f.id, missed: missedCards.length, highMissed: missedCards.filter(c => d.categories.find(k => k.name === c.category).priority === "high").length,
      falseAlarms: estimated ? fa : null };
  });
}
// comparing a new version: the same scoring as notebooks/release_gate.py (eval.funnel), item by item, on the 1,000 reviewed transcripts
function scoreVersion(r, vid) {
  const out = r.versions.find(v => v.id === vid).outputs, missed = {}, byType = {};
  const typeOf = Object.fromEntries(r.types.map(t => [t.label, t.id]));
  const issues = r.items.filter(i => i.kind === "issue"), flagged = r.items.filter(i => out[i.id].flag);
  r.types.forEach(t => { missed[t.id] = issues.filter(i => typeOf[i.cat] === t.id && !out[i.id].flag).map(i => i.id); });
  const fa = flagged.filter(i => i.kind !== "issue");
  r.fa_types.forEach(t => { byType[t.id] = fa.filter(i => i.cat === t.id).map(i => i.id); });
  const total = r.types.reduce((n, t) => n + missed[t.id].length, 0), high = r.high.reduce((n, x) => n + missed[x].length, 0);
  return { flags: flagged.length, caught: flagged.filter(i => i.kind === "issue").length, issues: issues.length, missed,
           missed_total: total, missed_high: high, false_alarms: fa.map(i => i.id), false_alarms_by_type: byType };
}
function gateResult(r, vid) {
  const s = scoreVersion(r, vid), b = scoreVersion(r, r.baseline);
  const other = s.missed_total - s.missed_high, baseOther = b.missed_total - b.missed_high;
  if (s.missed_high) return { passed: false, headline: "Not ready", detail: `${s.missed_high} high-priority ${s.missed_high === 1 ? "miss" : "misses"}` };
  if (other > baseOther) return { passed: false, headline: "Not ready", detail: "0 high-priority misses, but more lower-priority misses than current production" };
  return { passed: true, headline: "Ready", detail: "0 high-priority misses" };
}
if (typeof module !== "undefined") module.exports = { totals, rows, barScale, cardsFor, faTypeCards, perView, windowOf, niceDate, niceDateTime, problems, fixImpact, scoreVersion, gateResult };

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const app = document.getElementById("app");
const state = { offset: {}, shut: new Set(), per: perView(window.innerWidth), scroll: 0 };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const KIND = { missed: { label: "missed", word: "Missed", colour: "var(--red)" }, false_alarm: { label: "false alarms", word: "False alarm", colour: "var(--amber-bar)" } };

// short quotes in full; long ones trimmed to the sentence that holds the highlight (still word for word)
function quote(x) {
  const s = x.quote.length <= 120 ? x.quote : x.quote.split(/(?<=[.!?])\s+/).find(z => z.includes(x.highlight)) || x.quote;
  return esc(s).replace(esc(x.highlight), `<mark>${esc(x.highlight)}</mark>`);
}
// an example card: identical for recommendations and categories (quote with highlight, masked ID, date and call time)
function exampleCard(e, extra = "", cls = "") {

}

const PRI = { high: "High priority", medium: "Medium priority", low: "Low priority" };
function category(r, kind, scale, level) {

  const outOf = kind === "missed" ? r.base + r.count : r.base + r.count;
  const top = `<div class="top"${has ? ` role="button" tabindex="0" aria-expanded="${!shut}" data-toggle="${esc(key)}"` : ""}>

function fixesSection() {
  const imp = fixImpact(D);

  <p class="secsub">Based on the human reviewers' comments and an independent review of the AI's logs</p>

    const boxes = [x.missed ? `<div class="ib m" data-imp="missed"><b>${x.missed}</b> fewer risks missed by AI${x.highMissed ? `, ${x.highMissed} of them high priority` : ""}</div>` : "",

}

function faType(ty) {
  const key = `fatype|${ty.id}`, list = faTypeCards(D, ty.id), has = list.length > 0, shut = state.shut.has(key), total = totals(D).falseAlarms;
  const top = `<div class="top"${has ? ` role="button" tabindex="0" aria-expanded="${!shut}" data-toggle="${esc(key)}"` : ""}>
    <div><div class="n">${esc(ty.name)}</div><div class="d">${esc(ty.description)}</div></div>

  const group = (rs, kind, scale, levelFor) => [["high"], ["medium", "low"]].map(ps => `<div class="grp"><i style="background:var(--${ps[0] === "high" ? "hi" : "lo"})"></i>${ps[0] === "high" ? "High priority" : "Medium and low priority"}</div>` +

}

const IDRE = /\b(?:Expert|Person|Reviewer|Company|Client|Staff) \d{4}\b/g;
const paras = s => s.split(/\n\n/).map(x => `<p>${esc(x)}</p>`).join("");
function ents(s, tags = {}) {
  return esc(s).replace(IDRE, id => `<span class="ent ${id.split(" ")[0].toLowerCase()}" title="${esc([id, ...(tags[id] || [])].join(", "))}">${id}</span>`);
}
function legend(tags) {
  return `<div class="legend"><div class="k">Masked names in this call</div><ul>${Object.entries(tags).map(([id, t]) =>
    `<li><span class="ent ${id.split(" ")[0].toLowerCase()}">${id}</span>${esc(t.join(" · "))}</li>`).join("")}</ul>
    <p>Names are replaced with IDs that stay the same in every transcript. The tags record what the review needs, such as whether a company is listed. The list that matches IDs to names is held separately and is not used here.</p></div>`;
}
function transcript(id) {
  const t = D.transcripts[id];
  if (!t) return `<div class="view"><a class="back" href="#">Benchmark</a><p class="notfound">That transcript isn't in this benchmark.</p></div>`;
  const k = KIND[t.kind];
  const turns = t.turns.map(x => {
    const expert = x.speaker === "EXPERT", hit = x.ts === t.passage_ts;
    const text = hit ? `<div class="hit ${t.kind}" id="passage"><span class="htag">${k.word} · ${esc(t.category)}</span><div>${ents(x.text, t.entities)}</div>
      <div class="notes"><div class="note rev"><div class="nt">Human reviewer's comment</div><div class="ns">${ents(t.reviewer)} · <time datetime="${t.reviewed_at}">${niceDateTime(t.reviewed_at)}</time></div>${paras(t.reviewer_comment)}</div>
      <div class="note agent"><div class="nt">${t.kind === "missed" ? "Why the original AI didn't flag it" : "Why the original AI flagged it"}</div>
      <div class="ns">From an independent review of the AI's log</div>${paras(t.root_cause)}</div></div></div>` : `<div class="x">${ents(x.text, t.entities)}</div>`;
    return `<div class="turn${expert ? "" : " q"}"><span class="t">${x.ts}</span><div><div class="s">${expert ? "Expert" : x.speaker === "AI INTERVIEWER" ? "AI interviewer" : "Interviewer"}</div>${text}</div></div>`;
  }).join("");
  return `<div class="view"><a class="back" href="#">Current AI performance</a><div class="eyebrow">Transcript ${t.tid}</div><h1>${esc(t.topic)}</h1>
    <div class="ctx"><div><div class="k">Expert</div><div class="v"><b>${ents(t.name, t.entities)}</b></div></div>
    <div><div class="k">Call date</div><div class="v">${niceDate(t.date)}</div></div>
    <div><div class="k">Role</div><div class="v">${ents(t.role, t.entities)}</div></div>
    <div class="wide"><div class="k">Declared</div><div class="v">${ents(t.declaration, t.entities)}</div></div></div>
    ${legend(t.entities)}<div class="tr">${turns}</div></div>`;
}

// ---- compare a new version with current production ----
const R = D.release;
state.ver = "v1.1"; state.ran = null; state.running = false;
const ver = id => R.versions.find(x => x.id === id);
const ITEM = Object.fromEntries(R.items.map(i => [i.id, i]));
const CARD = Object.fromEntries(D.cards.map(c => [c.id, c]));
const N = R.transcripts.toLocaleString("en-GB");
const PRI_ORDER = { high: 0, medium: 1, low: 2 };
const tref = (id, vid) => { const i = ITEM[id]; return i.key ? `<a class="tlink" href="#c/${vid}/${i.id}">T${i.tid}</a>` : `<span class="tlink plain">T${i.tid}</span>`; };

function runGate() {
  if (state.running) return;
  state.running = true; state.ran = null; render();
  setTimeout(() => {
    state.running = false; state.ran = state.ver;
    if (location.hash === "#compare") { render(); document.getElementById("result")?.focus(); }
  }, 900);
}
function missTable(vid) {
  const b = scoreVersion(R, R.baseline), s = scoreVersion(R, vid);
  const cell = (sc, t, v) => `<td class="num${sc.missed[t.id].length ? " bad" : ""}">${sc.missed[t.id].length}<span class="trefs">${sc.missed[t.id].map(id => tref(id, v)).join("")}</span></td>`;
  const rowsHtml = [...R.types].sort((x, y) => PRI_ORDER[x.priority] - PRI_ORDER[y.priority]).map(t =>
    `<tr><th scope="row">${esc(t.label)}</th><td><span class="pri ${t.priority}">${PRI[t.priority].replace(" priority", "")}</span></td>${cell(b, t, R.baseline)}${cell(s, t, vid)}</tr>`).join("");
  return `<table class="ctab"><caption>Missed issues: actual issues the AI did not flag</caption>
    <thead><tr><th>Issue type</th><th>Priority</th><th class="num">Current production missed</th><th class="num">New version missed</th></tr></thead>
    <tbody>${rowsHtml}</tbody><tfoot><tr><th scope="row">All types (${b.issues} actual issues)</th><td></td><td class="num${b.missed_total ? " bad" : ""}">${b.missed_total}</td><td class="num${s.missed_total ? " bad" : ""}">${s.missed_total}</td></tr></tfoot></table>`;
}
function faTable(vid) {
  const b = scoreVersion(R, R.baseline), s = scoreVersion(R, vid);
  const rowsHtml = R.fa_types.map(t => `<tr><th scope="row">${esc(t.label)}</th><td class="num">${b.false_alarms_by_type[t.id].length}</td><td class="num">${s.false_alarms_by_type[t.id].length}</td></tr>`).join("");
  return `<table class="ctab"><caption>False alarms: flagged by AI, not an actual issue</caption>
    <thead><tr><th>Type of non-issue</th><th class="num">Current production</th><th class="num">New version</th></tr></thead>
    <tbody>${rowsHtml}</tbody><tfoot><tr><th scope="row">All types</th><td class="num">${b.false_alarms.length}</td><td class="num">${s.false_alarms.length}</td></tr></tfoot></table>`;
}
function comparison(vid) {

    <div class="result ${g.passed ? "pass" : "fail"}" id="result" tabindex="-1" role="status"><div class="rh">${g.headline}</div><div class="rd">${esc(g.detail)}</div></div>

}
function allList(vid) {

  const misses = R.types.flatMap(t => s.missed[t.id]).map(id => ITEM[id]).sort((x, y) => PRI_ORDER[typeOf[x.cat].priority] - PRI_ORDER[typeOf[y.cat].priority]);
  const missRows = misses.map(i => { const c = i.card && CARD[i.card], t = typeOf[i.cat];
    return `<li class="al-row"><div class="al-h">${tref(i.id, vid)}<b>${esc(i.cat)}</b><span class="pri ${t.priority}">${PRI[t.priority]}</span></div>${c ? `<div class="al-q">\u201c${quote(c)}\u201d</div>` : ""}</li>`; }).join("");
  const faGroups = R.fa_types.map(t => { const ids = s.false_alarms_by_type[t.id];
    return `<li class="al-fa"><div class="al-h"><b>${esc(t.label)}</b><span class="cnt">${ids.length} false ${ids.length === 1 ? "alarm" : "alarms"}</span></div>${ids.length ? `<div class="trefs wrap">${ids.map(id => tref(id, vid)).join("")}</div>` : ""}</li>`; }).join("");
  return `<section class="block allb" aria-labelledby="all-h"><h2 id="all-h">All current misses and false alarms</h2>
    <p class="cmpnote">${esc(ver(vid).label)}: ${s.missed_total} missed, ${s.false_alarms.length} false alarms. Linked transcript IDs open the passage.</p>
    <h3 class="al-t">Missed (${s.missed_total})</h3>${missRows ? `<ul class="al-list">${missRows}</ul>` : `<p class="none">No missed issues.</p>`}
    <h3 class="al-t">False alarms (${s.false_alarms.length})</h3><ul class="al-list">${faGroups}</ul></section>`;
}
function versionOption(v) {
  const on = v.id === state.ver;
  return `<label class="ver${on ? " on" : ""}"><input type="radio" name="ver" value="${v.id}"${on ? " checked" : ""}><span class="dot" aria-hidden="true"></span>${esc(v.label)}</label>`;
}
function changes(v) {
  if (!v.changes.length) return `<p class="same">Nothing has changed: this is the version in production.</p>`;
  return `<ul class="chg">${v.changes.map(([k, text, changed]) => `<li class="${changed ? "on" : "off"}"><b>${esc(k)}:</b> ${esc(text)}</li>`).join("")}</ul>`;
}
function versions() {
  const v = ver(state.ver);
  return `<div class="view rel"><h1>Compare a new version</h1>
    <p class="lede">Run a new version on the same reviewed transcripts and compare it with current production.</p>
    <section class="block pickb"><h2>Choose a version</h2>
      <div class="vers" role="radiogroup" aria-label="Version">${R.versions.map(versionOption).join("")}</div>
      <div class="runrow"><button class="run" data-run${state.running ? " disabled" : ""}>${state.running ? `Running on all ${N} transcripts\u2026` : `Run on all ${N} reviewed transcripts`}</button></div>
    </section>
    <section class="block chgb"><h2>What's changed</h2><p class="vd">${esc(v.description)}</p>${changes(v)}</section>
    ${state.running ? `<section class="block loading" role="status"><span class="spin" aria-hidden="true"></span>Running on all ${N} transcripts\u2026</section>` : ""}
    ${state.ran ? comparison(state.ran) + allList(state.ran) : ""}</div>`;
}
function itemView(vid, id) {
  const i = ITEM[id], v = ver(vid), t = i && D.transcripts[i.key];
  if (!t || !v) return `<div class="view"><a class="back" href="#compare">Compare a new version</a><p class="notfound">That passage isn't in the reviewed transcripts.</p></div>`;
  const out = v.outputs[i.id], issue = i.kind === "issue", fat = !issue && R.fa_types.find(x => x.id === i.cat);
  const tag = issue ? `${out.flag ? "Caught" : "Missed"} · ${esc(i.cat)}` : `False alarm · ${esc(fat.label)}`;
  const own = i.card && CARD[i.card] && CARD[i.card].transcript === t.id && t.passage_ts === i.ts;
  const verdict = own ? paras(t.reviewer_comment) : esc(i.note || "");
  const turns = t.turns.map(x => {
    const expert = x.speaker === "EXPERT", hit = x.ts === i.ts && expert;
    const body = hit ? `<div class="hit ${issue ? (out.flag ? "found" : "missed") : "false_alarm"}" id="passage"><span class="htag">${tag}</span>
        <div>${ents(x.text, t.entities)}</div><div class="notes">
        <div class="note rev"><div class="nt">Human verdict</div><div class="ns">${issue ? "An actual issue" : "Not an actual issue"}</div>${verdict}</div>
        <div class="note agent"><div class="nt">What ${vid} said</div><div class="ns">Simulated</div>${out.flag ? "" : ""}${ents(out.reason, t.entities)}</div></div></div>`
      : `<div class="x">${ents(x.text, t.entities)}</div>`;
    return `<div class="turn${expert ? "" : " q"}"><span class="t">${x.ts}</span><div><div class="s">${expert ? "Expert" : x.speaker === "AI INTERVIEWER" ? "AI interviewer" : "Interviewer"}</div>${body}</div></div>`;
  }).join("");
  return `<div class="view"><a class="back" href="#compare">Compare a new version</a><div class="eyebrow">Transcript ${t.tid}</div><h1>${esc(t.topic)}</h1>
    <div class="ctx"><div><div class="k">Expert</div><div class="v"><b>${ents(t.name, t.entities)}</b></div></div>
    <div><div class="k">Version</div><div class="v">${esc(v.label)}</div></div>
    <div><div class="k">Role</div><div class="v">${ents(t.role, t.entities)}</div></div>
    <div class="wide"><div class="k">Declared</div><div class="v">${ents(t.declaration, t.entities)}</div></div></div>
    ${legend(t.entities)}<div class="tr">${turns}</div></div>`;
}

function route() {
  const h = location.hash;
  let m;
  if (h === "#compare") return { view: "compare", html: versions(), title: "Compare a new version", tab: "compare" };
  if ((m = h.match(/^#c\/(v[\d.]+)\/(i\d+)$/))) return { view: "testset", html: itemView(m[1], m[2]), title: `Transcript ${ITEM[m[2]]?.tid || ""}`, tab: "compare" };
  if ((m = h.match(/^#t\/(.+)$/))) { const id = decodeURIComponent(m[1]); return { view: "transcript", html: transcript(id), title: D.transcripts[id]?.topic, tab: "summary" }; }
  return { view: "summary", html: summary(), title: null, tab: "summary" };
}
function render() {
  const r = route();
  app.innerHTML = r.html;
  document.title = r.title ? `${r.title} · Content review AI: performance benchmark` : "Content review AI: performance benchmark";
  document.querySelectorAll("[data-tab]").forEach(a => a.toggleAttribute("aria-current", a.dataset.tab === r.tab));
  document.body.dataset.view = r.view;
  document.body.dataset.ready = "1";
}

app.addEventListener("change", e => {
  if (e.target.name === "ver") { state.ver = e.target.value; render(); app.querySelector(`input[value="${state.ver}"]`).focus(); }
});
app.addEventListener("click", e => {
  if (e.target.closest("[data-run]")) { runGate(); return; }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const key = mv.dataset.move, [kind, name] = key.split("|");
    const n = kind === "fatype" ? faTypeCards(D, name).length : cardsFor(D, kind, name).length;
    state.offset[key] = windowOf(n, (state.offset[key] || 0) + Number(mv.dataset.step), state.per).start;
    mv.closest(".cat").outerHTML = rerow(key, mv.closest(".cat"));
    const fresh = app.querySelector(`[data-cat="${CSS.escape(key)}"]`);
    fresh.querySelector(".cards").classList.add("moved");
    fresh.querySelector(`[data-move][data-step="${mv.dataset.step}"]:not(:disabled)`)?.focus();
    return;
  }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { toggle(tg.dataset.toggle); return; }
  const jp = e.target.closest("[data-jump]");
  if (jp) jump(jp.dataset.jump);
});
function jump(id) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.getElementById(id).scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}
app.addEventListener("keydown", e => {
  const tg = e.target.closest("[data-toggle]");
  if (tg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tg.dataset.toggle); }
  const jp = e.target.closest("[data-jump]");
  if (jp && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jump(jp.dataset.jump); }
});
function rerow(key, cat) {
  const [kind, name] = key.split("|");
  if (kind === "fatype") return faType(D.false_alarm_types.find(t => t.id === name));
  return category(rows(D, kind).find(r => r.name === name), kind, barScale(rows(D, kind)), cat.classList.contains("hi") ? "hi" : cat.classList.contains("lo") ? "lo" : "am");
}
function toggle(key) {
  state.shut.has(key) ? state.shut.delete(key) : state.shut.add(key);
  const cat = app.querySelector(`[data-cat="${CSS.escape(key)}"]`);
  cat.outerHTML = rerow(key, cat);
  app.querySelector(`[data-cat="${CSS.escape(key)}"] [data-toggle]`).focus();
}
window.addEventListener("hashchange", () => {
  const from = document.body.dataset.view;
  if (from === "summary") state.scroll = window.scrollY;
  render();
  const to = document.body.dataset.view;
  if (to === "testset") document.getElementById("passage")?.scrollIntoView({ block: "center" });
  else window.scrollTo(0, to === "summary" && from === "transcript" ? state.scroll : 0);
});
window.addEventListener("resize", () => {
  const per = perView(window.innerWidth);
  if (per !== state.per) { state.per = per; if (document.body.dataset.view === "summary") render(); }
});
render();
</script>
</body>
</html>

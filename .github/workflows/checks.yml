name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Data is reproducible and embedded
        run: python3 notebooks/build_data.py && git diff --exit-code -- data/benchmark.json build/mvp.html
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Known-answer tests
        run: node build/test_mvp.js
      - name: Headless click-through
        run: node build/check_mvp.js
